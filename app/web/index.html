const GENERIC_MATS=[["exp_char","角色经验（猎人攻略）"],["exp_arc","弧盘经验（染剂）"],["coin","甲硬币"],
  ["ability_mat","技能书（按角色所选系）"],["arc_mat","弧盘突破·罐头（按角色所选系）"],["console_mat","空幕（按角色所选节点）"]];
let UPGRADES_CACHE = undefined;  // undefined=未加载, null=尚未抓取, object=已抓取
async function renderUpgradeBlock(host){
  if(UPGRADES_CACHE === undefined){
    try{ UPGRADES_CACHE = await api("/api/wiki/upgrades"); }
    catch(e){ UPGRADES_CACHE = null; }
  }
  const chars = UPGRADES_CACHE ? Object.entries(UPGRADES_CACHE.characters||{}) : [];
  const matName = (d, id) => (d.materials||{})[id]?.name || id;
  const itemsTxt = (d, items) => (items||[]).map(i=>`${esc(matName(d,i.id))}×${i.amount}`).join("、");
  const pick = $("#upgChar") ? $("#upgChar").value : (chars[0]?.[0]||"");
  const body = $("#upgBody");
  if(!chars.length){
    body.innerHTML = `<div class="empty">尚未抓取角色技能/突破数据</div>
      <div class="row" style="margin-top:8px"><button class="btn sec mini" id="btnUpgFetch">🌐 从 wiki 拉取全部角色数据（约 1 分钟）</button></div>`;
    const btn=document.getElementById("btnUpgFetch");
    btn.onclick=async()=>{ btn.disabled=true; btn.textContent="拉取中…（27 个角色，约 1 分钟）";
      try{ const fr=await fetch("/api/wiki/fetch-upgrades",{method:"POST",headers:AUTH_HEADERS,signal:AbortSignal.timeout(180000)});
        const d=await fr.json();
        toast(d.ok?((d.failed||[]).length?`已抓取 ${d.count} 个角色，${(d.failed||[]).length} 个失败沿用旧数据`:`已抓取 ${d.count} 个角色`):(d.error||"拉取失败"), d.ok?((d.failed||[]).length?"err":"ok"):"err");  // B2.8-B FETCH-01：partial（failed>0）提示沿用旧数据（err 样式），全成功保持原文案
        UPGRADES_CACHE = undefined; renderUpgradeBlock(host);
      }catch(e){alertErr(e); btn.disabled=false; btn.textContent="🌐 从 wiki 拉取全部角色数据（约 1 分钟）";}
    };
    return;
  }
  const d = UPGRADES_CACHE.characters[pick] || UPGRADES_CACHE.characters[Object.keys(UPGRADES_CACHE.characters)[0]];
  const ascRows = (d.ascension||[]).map((a,i)=>`
    <tr><td class="num"><b>突破${i+1}</b>（Lv${a.level}）</td><td>${itemsTxt(d,a.items)}</td></tr>`).join("");
  const skillRows = (d.skills||[]).map(s=>`
    <tr><td rowspan="${s.levels.length}"><b>${esc(s.name)}</b></td>${
      s.levels.map((lv,i)=>`${i>0?"<tr>":""}<td class="num">Lv${lv.level}${lv.require_breakthrough?`（需突破${lv.require_breakthrough}）`:""}</td><td>${itemsTxt(d,lv.items)}</td>${i<s.levels.length-1?"</tr>":""}`).join("")}
    </tr>`).join("");
  body.innerHTML = `
    <div class="row" style="margin-bottom:8px">
      <select id="upgChar">${chars.map(([slug,c])=>`<option value="${esc(slug)}" ${slug===pick?"selected":""}>${esc(c.name||slug)}</option>`).join("")}</select>
      <button class="btn sec mini" id="btnUpgRefetch">🔄 重新拉取</button></div>
    <div style="font-size:13px;color:var(--acc);margin:6px 0">角色突破（0-6 档）</div>
    <table><tr><th>档位</th><th>材料</th></tr>${ascRows}</table>
    <div style="font-size:13px;color:var(--acc);margin:12px 0 6px">异能技能逐级材料</div>
    <table><tr><th>技能</th><th>等级</th><th>材料</th></tr>${skillRows}</table>`;
  $("#upgChar").onchange=()=>renderUpgradeBlock(host);
  $("#btnUpgRefetch").onclick=async()=>{ UPGRADES_CACHE=undefined; renderUpgradeBlock(host); };
}

async function renderBreakthroughBlock(host){
  /* 角色突破门槛材料（本地权威模型）：等级 cur→tgt 跨越的门槛（30→31…）
     × wiki charBreak 逐档表 + 目录材料归属 + 库存持有 */
  host.innerHTML='<div class="muted">加载中…</div>';
  let r;
  try{ r=await api("/api/breakthrough-needs"); }
  catch(e){ host.innerHTML=`<div class="banner warn">加载失败：${esc(e.message)}</div>`; return; }
  const rows=(r.characters||[]).filter(c=>c.gates&&c.gates.length);
  if(!rows.length){
    host.innerHTML=`<div class="muted">没有待突破的角色：把角色卡的「角色等级目标」调高跨过门槛（30/40/50/60/70，即突破到 31/41/51/61/71）即自动出现门槛材料与缺口。</div>`;
    return;
  }
  host.innerHTML=rows.map(c=>{
    // 当前档→目标档 合计（逐门槛按材料聚合：需/持/缺 全量汇总）
    const totals={};
    c.gates.forEach(g=>g.mats.forEach(m=>{
      const t=totals[m.mat_id]=totals[m.mat_id]||{name:m.name,need:0,have:0,short:0};
      t.need+=m.need; t.have+=m.have; t.short+=m.short;
    }));
    return `
    <div style="margin:10px 0 4px"><b>${esc(c.name)}</b>
      <span class="muted num">等级 ${c.level_cur} → ${c.level_tgt}</span>
      <span class="muted num">觉醒 ${c.awakening}</span>
      ${c.in_catalog?"":`<span class="tag warn">目录未收录：BOSS/小怪归属缺失</span>`}</div>
    <table><tr><th>突破门槛</th><th>材料（需 / 持 / 缺）</th></tr>
      ${c.gates.map(g=>`<tr><td class="num"><b>Lv${g.gate} → ${g.to_level}</b></td>
        <td>${g.mats.map(m=>`${esc(m.name)} <span class="num">需${m.need} / 持${m.have} / 缺<b>${m.short}</b></span>`).join("、")||"（材料归属未收录）"}</td></tr>`).join("")}
      <tr><td class="num"><b>合计（${c.level_cur}→${c.level_tgt}）</b></td>
        <td>${Object.values(totals).map(t=>`${esc(t.name)} <span class="num">需${t.need} / 持${t.have} / 缺<b>${t.short}</b></span>`).join("、")||"（材料归属未收录）"}</td></tr>
    </table>`;}).join("")
    +`<div class="muted" style="margin-top:6px">数据源：wiki charBreak 逐档真实表（本地 mysqil 快照）+ 目录材料归属；突破材料与觉醒档位无关，按等级门槛自动计入角色培养缺口。</div>`;
}

function buildReqEditor(){
  const req=BOOT.tables.requirements, host=$("#reqEditor");
  const generic=new Map(GENERIC_MATS);
  const matLabel=id=>generic.get(id)||matAllName(id);
  const matOpts=sel=>[...generic.entries()].map(([k,label])=>
      `<option value="${k}" ${k===sel?"selected":""}>${esc(label)}</option>`).join("")
    +allMaterials().map(m=>`<option value="${m.id}" ${m.id===sel?"selected":""}>${esc(m.display)}</option>`).join("");
  host.innerHTML=Object.entries(req.tracks||{}).map(([key,t])=>`
    <div class="char open" data-track-edit="${key}">
      <div class="head">
        <input class="t-name" value="${esc(t.name||key)}" style="width:130px" title="轨道名">
        <span class="muted">上限</span><input class="t-max" type="number" value="${t.max??999}" style="width:70px">
        <span class="grow"></span>
        <button class="btn sec mini" data-act="addBand">＋ 添加等级段</button>
      </div>
      <div class="body" style="display:block">
        ${(t.ladder||[]).map(b=>bandRow(b)).join("")||`<div class="muted band-empty">（暂无等级段：本轨道不参与换算，可在角色『直接材料需求』里手填）</div>`}
      </div>
    </div>`).join("");
  function bandRow(b){
    return `<div class="band-row card" style="margin:6px 0;padding:10px;box-shadow:none">
      <div class="row" style="gap:6px;margin-bottom:6px">
        <span class="muted">从</span><input class="b-from" type="number" value="${b?.from??1}" style="width:70px">
        <span class="muted">到</span><input class="b-to" type="number" value="${b?.to??10}" style="width:70px">
        <span class="grow"></span>
        <button class="btn sec mini" data-act="addBandItem">＋ 材料</button>
        <button class="btn sec mini" data-act="delBand">删除本段</button>
      </div>
      <div class="grid band-items">
      ${Object.entries(b?.items||{}).map(([mat,cnt])=>bandItem(mat,cnt)).join("")
        ||`<div class="muted">（未配置材料）</div>`}
      </div>
    </div>`;
  }
  function bandItem(mat,cnt){
    return `<div class="row band-item" style="gap:6px">
      <select style="flex:1">${matOpts(mat)}</select>
      <input type="number" value="${cnt}" min="0" style="width:100px" placeholder="数量">
      <button class="btn sec mini" data-act="delItem">×</button></div>`;
  }
  host.querySelectorAll('[data-act="addBand"]').forEach(btn=>btn.onclick=()=>{
    const card=btn.closest("[data-track-edit]");
    const body=card.querySelector(".body");
    body.querySelector(".band-empty")?.remove();
    body.insertAdjacentHTML("beforeend",bandRow({from:1,to:10,items:{}}));
    bindBandButtons(card);
  });
  function bindBandButtons(scope){
    scope.querySelectorAll('[data-act="delBand"]').forEach(btn=>btn.onclick=()=>btn.closest(".band-row").remove());
    scope.querySelectorAll('[data-act="addBandItem"]').forEach(btn=>btn.onclick=()=>{
      const items=btn.closest(".band-row").querySelector(".band-items");
      items.querySelector(".muted")?.remove();
      items.insertAdjacentHTML("beforeend",bandItem("exp_char",0));
      bindBandButtons(scope);
    });
    scope.querySelectorAll('[data-act="delItem"]').forEach(btn=>btn.onclick=()=>btn.closest(".band-item").remove());
  }
  bindBandButtons(host);
}

/* ---------- 历史 ---------- */
function historyChart(history){
  const days = {};
  (history||[]).forEach(h=>{const d=days[h.day]=days[h.day]||{s:0,g:0,n:0};
    d.s+=h.stamina||0; d.g+=h.gain||0; d.n++;});
  const list = Object.entries(days).sort((a,b)=>a[0]<b[0]?-1:1).slice(-14);
  if(!list.length) return "";
  const W=680,H=150,pad=28,bw=Math.max(8,(W-pad*2)/list.length-6);
  const maxV=Math.max(1,...list.map(([,d])=>Math.max(d.s,d.g)));
  const bars=list.map(([day,d],i)=>{
    const x=pad+i*((W-pad*2)/list.length)+( (W-pad*2)/list.length-bw)/2;
    const hs=Math.round((H-30)*d.s/maxV), hg=Math.round((H-30)*d.g/maxV);
    const t=`title="${day}：体力 ${d.s} / 产出 +${d.g}（${d.n} 次执行）"`;
    return `<rect x="${x}" y="${H-22-hs}" width="${bw/2-1}" height="${hs}" rx="2" fill="#53b6ff" ${t}/>
      <rect x="${x+bw/2+1}" y="${H-22-hg}" width="${bw/2-1}" height="${hg}" rx="2" fill="#3ecf8e" ${t}/>
      <text x="${x+bw/2}" y="${H-8}" fill="#5f7186" font-size="9" text-anchor="middle">${day.slice(5)}</text>`;
  }).join("");
  return `<div class="card"><h3>最近 14 天<span class="h-sub">每日体力消耗 / 预计产出，悬停看明细</span></h3>
    <svg width="${W}" height="${H}" style="max-width:100%">${bars}
      <text x="${pad}" y="14" fill="#53b6ff" font-size="11">■ 体力消耗</text>
      <text x="${pad+90}" y="14" fill="#3ecf8e" font-size="11">■ 预计产出</text></svg></div>`;
}
function statusTag(st){
  const map={done:["ok","完成"],short:["warn","体力不足"],skipped:["warn","跳过"],
    failed:["err","失败"],stopped:["acc","已停止"],reconciled:["acc","已对账"]};
  const m=map[st]||["",""];
  return m[0]?`<span class="tag ${m[0]}">${m[1]}</span>`:`<span class="tag">${esc(st)}</span>`;
}

    <td class="num"><b>${s.measured_yield}</b></td><td class="num"><b>${s.suggested_yield}</b></td>
    <td>${s.suggested_yield!==s.configured_yield
      ?`<button class="btn mini" data-apply-mat="${esc(s.mat_id)}" data-apply-val="${s.suggested_yield}">应用</button>`
      :`<span class="tag ok">一致</span>`}</td></tr>`).join("");
  const sugCard=(sug.suggestions||[]).length?`<div class="card"><h3>产量校准建议<span class="h-sub">基于已确认实际获得；只建议，应用后走产量表通道</span></h3>
    <table><tr><th>材料</th><th>当前产量</th><th>已确认累计</th><th>实测每轮</th><th>建议值</th><th>操作</th></tr>${sugRows}</table>
    <div class="muted" style="margin-top:8px">measured = Σ实际获得 ÷ Σ轮数（全部已确认的完成记录）；应用 = 把该材料的每轮产出改为建议值。样本少时建议先多确认几条再看。</div></div>`:"";
  $("#main").innerHTML=`${chart}${sugCard}<div class="card"><h3>执行历史<span class="h-sub">最近 200 条</span></h3>
    ${rows?`<table><tr><th>时间</th><th>目标</th><th>轮数</th><th>体力</th><th>预计产出</th><th>实际获得</th><th>结果</th><th>备注</th></tr>${rows}</table>`
      :`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>还没有执行记录</div>`}</div>`;
  document.querySelectorAll("[data-cf]").forEach(btn=>btn.onclick=async()=>{
    const wrap=btn.closest(".row");
    const inp=wrap.querySelector("input[data-cf-day]");
    const v=+inp.value;
    if(!(v>=0)){toast("请填写非负整数","err");return;}
    try{
      const res=await api("/api/history/confirm",{day:inp.dataset.cfDay,time:inp.dataset.cfTime,mat_id:inp.dataset.cfMat,actual_gain:v});
      if(!res.ok) throw new Error(res.message||res.error);
      renderHistory();
    }catch(e){alertErr(e);}
  });
  document.querySelectorAll("[data-apply-mat]").forEach(btn=>btn.onclick=async()=>{
    const mat=btn.dataset.applyMat, val=+btn.dataset.applyVal;

    try{

      BOOT.tables.yields=res.yields;
      toast(`「${matName(mat)}」产量已改为 ${val}`);
      renderHistory();
    }catch(e){alertErr(e);}
  });
}

async function onCodexWikiFetch(){
  const name=$("#cx_name").value.trim();

  try{
    const r2=await api("/api/game-data/wiki-fetch?name="+encodeURIComponent(name));
    if(r2.wiki_summary)
      info.textContent=`wiki 四组成员数：${Object.entries(r2.wiki_summary.groups).map(([k,v])=>k+"="+v).join(" / ")}（${r2.wiki_summary.fetched_at}）`;
    if(!r2.ok){toast(r2.error||"拉取失败","err");return;}
    if(!r2.found){toast(r2.note||"wiki 未收录该角色","err");return;}

    $("#cx_skill").value=p.skill_series||"";
    $("#cx_book").value=p.skill_book_name||"";
    $("#cx_family").value=p.mob_family||"";

    const s=$("#cx_wiki_summary"); s.style.display="flex";

/* ---------- 日志（ok-nte 任务/应用日志 + 面板日志） ---------- */
let LOGS_CURRENT = {files: [], idx: -1, lines: 300};
async function renderLogs(){
  const r = await api("/api/logs").catch(e=>({error:e.message}));
  if(r.error){ $("#main").innerHTML=`<div class="card"><div class="banner warn">${esc(r.error)}</div></div>`; return; }
  LOGS_CURRENT.files = r.logs||[];
  const rows = LOGS_CURRENT.files.map((f,i)=>`
    <tr><td><b>${esc(f.name)}</b></td><td class="muted num">${esc(f.mtime)}</td><td class="num">${(f.size/1024).toFixed(1)} KB</td>
    <td><button class="btn sec mini" data-log-view="${i}">查看尾部</button>
    <button class="btn sec mini" data-log-dl="${i}">⬇ 导出</button></td></tr>`).join("");
  $("#main").innerHTML=`
    <div class="card"><h3>日志文件<span class="h-sub">ok-nte 任务日志 / 应用日志 / 面板自身日志；查看末尾 300 行（可加载到 2000），或导出完整文件</span></h3>
    ${rows?`<table><tr><th>文件</th><th>修改时间</th><th>大小</th><th>操作</th></tr>${rows}</table>`
      :'<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>还没有可读的日志文件（首次执行 ok-nte 任务后产生）</div>'}</div>
    <div class="card" id="logViewCard" style="display:none"><h3 id="logViewName"></h3>
      <div id="logView" class="term" style="height:440px"></div>
      <div class="row" style="margin-top:8px"><button class="btn sec mini" id="btnLogMore">加载更多行</button>
      <button class="btn sec mini" id="btnLogDl">⬇ 导出完整文件</button>
      <span class="muted" id="logViewMeta"></span></div></div>`;
  document.querySelectorAll("[data-log-view]").forEach(b=>b.onclick=()=>viewLog(+b.dataset.logView, LOGS_CURRENT.lines));
  document.querySelectorAll("[data-log-dl]").forEach(b=>b.onclick=()=>downloadLog(+b.dataset.logDl));
  $("#btnLogMore").onclick=()=>viewLog(LOGS_CURRENT.idx, Math.min(2000, LOGS_CURRENT.lines+300));
  $("#btnLogDl").onclick=()=>downloadLog(LOGS_CURRENT.idx);
}
async function viewLog(idx, lines){
  try{
    const r=await api(`/api/logs/tail?i=${idx}&lines=${lines}`);
    LOGS_CURRENT.idx=idx; LOGS_CURRENT.lines=lines;
    $("#logViewCard").style.display="block";
    $("#logViewName").textContent=r.name;
    $("#logViewMeta").textContent=`显示末尾 ${r.lines.length} 行 / 共 ${r.total} 行`;
    const el=$("#logView");
    el.textContent=r.lines.join("\n")||"（空文件）";
    el.scrollTop=el.scrollHeight;
    $("#logViewCard").scrollIntoView({behavior:"smooth",block:"nearest"});
  }catch(e){alertErr(e);}
}
async function downloadLog(idx){
  const f=LOGS_CURRENT.files[idx]; if(!f)return;
  try{
    const res=await fetch(`/api/logs/download?i=${idx}`,{headers:AUTH_HEADERS});
    if(!res.ok){ toast("日志导出失败","err"); return; }
    const text=await res.text();
    const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=f.name.replace("/","_")+".log";
    a.click(); URL.revokeObjectURL(a.href);
    toast("日志已导出");
  }catch(e){alertErr(e);}
}

      <div id="dgBody" class="muted">加载中…</div></div>`;
  let d;
  try{ d=await (await fetch("/api/dungeon-gaps",{headers:AUTH_HEADERS})).json(); }
  catch(e){ const b=$("#dgBody"); if(b) b.textContent="加载失败："+e.message; return; }
  const body=$("#dgBody");
  if(!body) return;  // 加载期间切页：#main 已重建，不写旧节点
  body.className="";
  // 材料统计块（2026-11-08 迭代，替代原 chip+纯文本行）：左=材料 chip（title=mat_id）/
  // 中=需·持·差 三格（差 gap>0 时 err 大字，=0 弱化「已齐」）/ 右=「约 N 轮 · N 体力」
  // pill（N 体力=runs×本块 stamina_per_run，与块合计 total_stamina 同口径）；runs=0 且
  // 缺口>0 → 「无产量数据」（周本材料后端不下发每轮产量，planner.dungeon_gaps）；
  // gap=0 → pill 不显示。
  const dstat=(label,val)=>`<div class="dstat"><span class="ds-label">${label}</span><span class="ds-val num">${val}</span></div>`;
  const gapCell=m=>m.gap>0
    ?`<div class="dstat dstat-gap"><span class="ds-label">差</span><span class="ds-val num">${m.gap}</span></div>`
    :`<div class="dstat dstat-gap gap-zero"><span class="ds-label">差</span><span class="ds-val">已齐</span></div>`;
  const runPill=(m,perRun)=>m.runs>0
    ?`<span class="tag acc num" style="margin-left:auto">约 ${m.runs} 轮 · ${m.runs*perRun} 体力</span>`
    :(m.gap>0?`<span class="muted" style="margin-left:auto">无产量数据</span>`:"");
  const gapRow=(m,perRun)=>`<div class="dmat">
    <span class="chip acc" style="max-width:220px" title="${esc(m.mat_id)}">${esc(m.name)}</span>
    ${dstat("需",m.need)}${dstat("持",m.have)}${gapCell(m)}${runPill(m,perRun)}</div>`;
  const cards=(d.blocks||[]).map(b=>{
    const weekly=b.weekly_times?`<div class="row" style="gap:8px;margin-top:6px">
        <span class="tag acc">周本口径</span>
        <span class="muted">每周限 ${b.weekly_times} 次 × ${b.stamina_per_run} 体力 = ${b.weekly_stamina} 体力/周（用户口径；面板未追踪本周已刷次数，材料缺口无每轮产量，不计入轮数合计）</span></div>`:"";
    const dual=b.dual_channel?`<div class="row" style="gap:8px;margin-top:6px">
        <span class="tag warn">双通道</span>
        <span class="muted">${esc(b.note||"")}</span></div>`:"";
    return `<div class="card">
      <h3>${esc(b.block||"—")}<span class="h-sub">${esc(b.entry||"—")} · ${b.stamina_per_run} 体力/轮${b.limits?` · ${esc(b.limits)}`:""}</span></h3>
      ${(b.mats||[]).map(m=>gapRow(m,b.stamina_per_run)).join("")||`<div class="muted">本块无材料</div>`}
      <div class="row" style="gap:14px;margin-top:4px;padding-top:9px;border-top:1px dashed var(--line)">
        <b>合计</b><span class="num">约 ${b.total_runs} 轮 / ${b.total_stamina} 体力</span>
        ${(b.mats||[]).filter(m=>m.runs>0).length>1?`<span class="muted">各材料轮数直和——每轮只产出所选的一个系列/对应 boss，需按材料分别执行</span>`:""}
        ${b.task_type?`<span class="tag">${esc(b.task_type)}</span>`:""}
      </div>
      ${weekly}${dual}
      ${b.note&&!b.dual_channel?`<div class="muted" style="margin-top:6px">${esc(b.note)}</div>`:""}
    </div>`;}).join("");
  const ext=(d.external||[]);
  const extCard=ext.length?`<div class="card">
      <h3>外部来源材料<span class="h-sub">不在六块体力副本内——无法按轮数规划，仅展示缺口</span></h3>
      ${ext.map(m=>`<div class="dmat">
        <span class="chip ${m.extra?"warn":"acc"}" style="max-width:220px" title="${esc(m.mat_id)}">${esc(m.name)}</span>
        ${dstat("需",m.need)}${dstat("持",m.have)}${gapCell(m)}
        <span style="display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;min-width:0"><span class="tag ${m.extra?"warn":""}">${m.extra?"外部来源":"体力本（未入块）"}</span>${m.source?`<span class="muted">${esc(m.source)}</span>`:""}</span></div>`).join("")}
    </div>`
    :`<div class="card"><h3>外部来源材料</h3><div class="muted">当前无未入块的材料缺口</div></div>`;
  body.innerHTML=cards+extCard
    +`<div class="muted" style="margin-top:4px">口径：轮数=缺口÷每轮产量向上取整（与当日计划 make_plan 同口径）；追猎块按每局掉落（yields.json hunter_yield，默认 8）折算；周本材料无每轮产量，只展示缺口与周次数口径。体力本入口/掉落为调研观测值，以 data/materials.json stamina_blocks 各块 note 为准。</div>`;
}

/* ---------- 框架 ---------- */
const PAGE_TITLES={overview:["总览","当日计划 · 执行控制 · 推演"],chars:["角色","养成目标与直接材料需求"],
  arc:["弧盘","按名字选择 · 物态适配过滤 · 材料按目标计算"],
  nullmux:["空幕","卡带 × 驱动块 · 词条记录"],
  dungeons:["材料副本","体力缺口 → 副本轮数 · 六块分组 · 只读聚合"],
  teams:["配队","4 人队伍 · 跨队可复用 · 队内唯一"],
  codex:["图鉴数据","手动录入新角色/武器 + wiki 拉取预填"],
  common:["通用材料","每角色通用数量 → 具体材料映射"],inv:["库存","全量材料持有量"],
  tables:["数据表","产量 · 需求表 · 材料名校准"],settings:["设置","执行策略 · 体力模型 · 导入导出"],
  history:["历史","执行记录与产量校准闭环"],logs:["日志","ok-nte 任务/应用日志 · 面板日志"],
  gacha:["抽卡分析","塔吉多官方抽卡记录 · 手动同步 · 本地累积"]};
async function boot(){
  BOOT=await api("/api/bootstrap");
  window.__A2S__ = BOOT.attr_map||{};  // 属性→书系映射（技能书适配过滤用）
  window.__GUIDE_SLUG_NAMES__ = BOOT.guide_slug_names||{};  // slug↔实名表（BIS 别名归一用）
  const tags=[];
  const c = BOOT.compat;
  if (c.status === "incompatible")
    tags.push(`<span class="tag err" title="${esc((c.problems||[]).join('；'))}">ok-nte 不兼容</span>`);
  else if (c.status === "compatible_with_warning")
    tags.push(`<span class="tag warn" title="${esc((c.warnings||[]).join('；'))}">ok-nte ${esc(c.version||"?")} 兼容(警告)</span>`);
  else
    tags.push(`<span class="tag ok">ok-nte ${esc(c.version||"?")}</span>`);
  tags.push(BOOT.admin?`<span class="tag ok">管理员</span>`:`<span class="tag warn">非管理员</span>`);
  // 复审阻断⑤：DXGI 采集探测失败常驻警示（内嵌 Python 缺 d3dshot → capture_method
  // 回落 BitBlt_RenderFull 卡死路径）；tooltip 带修复命令
  if (BOOT.capture_warning)
    tags.push(`<span class="tag warn" title="${esc(BOOT.capture_warning)}">DXGI 未生效</span>`);
  tags.push(BOOT.oknte_running?`<span class="tag warn">ok-nte 运行中</span>`:`<span class="tag ok">ok-nte 已关闭</span>`);
  tags.push(`<span class="tag" title="构建标识：若与你刚安装的版本不符，说明浏览器开的是旧面板页面（关掉重开即可）">构建 ${esc((BOOT.build||{}).built_at||"dev")}</span>`);
  $("#envTags").innerHTML=tags.join("");
}
let CURRENT="overview";
function switchPage(t){
  CURRENT=t;
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x.dataset.t===t));
  const title=PAGE_TITLES[t]||[t,""];
  $("#pageTitle").textContent=title[0];
  $("#pageSub").textContent=title[1];
  clearInterval(TIMER);
  if(!BOOT) return;  // bootstrap 未完成（兼容检测约需数秒）：先记下目标页，boot 完成后按 CURRENT 渲染
  // 返回渲染函数的 Promise（各 renderX 为 async）：跨页跳转（如抽卡页「去绑定」→
  // 角色页 #tjdStatus）需要等渲染完成后再 scrollIntoView，否则滚的是旧骨架。
  // 先渲染、再设 timer、最后 return：勿把 return 放中间——那会让下面的 overview
  // 2s 轮询（总览页唯一的自动刷新，refreshStatus 不自调度）变成死代码（复审①）
  const p=({overview:renderOverview,chars:renderChars,arc:renderArc,nullmux:renderNullmux,teams:renderTeams,
    codex:renderCodex,common:renderCommon,inv:renderInv,dungeons:renderDungeons,
    tables:renderTables,settings:renderSettings,history:renderHistory,logs:renderLogs,gacha:renderGacha})[t]();
  if(t==="overview") TIMER=setInterval(refreshStatus,2000);
  return p;
}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>switchPage(b.dataset.t));

/* ---------- 明亮/暗色主题（四页调整④）：documentElement[data-theme] 驱动 CSS
   变量覆盖块（见样式区 [data-theme="light"]），localStorage('theme') 持久化，
   启动恢复；缺省=暗色（:root 默认变量集）。存不进（隐私模式等）静默跳过 ---------- */
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  const b=$("#btnTheme");
  if(b){ b.textContent=t==="light"?"☀️ 明亮":"🌙 暗色";
    b.title="切换到"+(t==="light"?"暗色":"明亮")+"主题"; }
  try{ localStorage.setItem("theme",t); }catch(_e){}
}
(function(){
  let t="dark";
  try{ if(localStorage.getItem("theme")==="light") t="light"; }catch(_e){}
  applyTheme(t);
})();
$("#btnTheme").onclick=()=>applyTheme(document.documentElement.dataset.theme==="light"?"dark":"light");

boot().then(()=>switchPage(CURRENT)).catch(e=>{
  $("#main").innerHTML=`<div class="card"><div class="banner warn">加载失败：${esc(e.message)}</div></div>`;
});
</script>
</body>
