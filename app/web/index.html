<script>
"use strict";
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let BOOT=null, TIMER=null;

async function api(path, body){
  const opt = body===undefined ? {} : {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)};
  const res = await fetch(path, opt);
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||res.status);
  return data;
}

/* ---------- 数据工具 ---------- */
function allMaterials(){
  // 统一材料目录：体力本目标（obtain=stamina）+ extra（hunter/external）
  const M=BOOT.tables.materials;
  const list=(M.targets||[]).map(t=>({id:t.id,display:t.display_name||t.name,category:t.category,
    source:t.source||"",obtain:"stamina",name:t.name}));
  (M.extra_materials||[]).forEach(m=>list.push({id:m.id,display:m.display_name||m.id,
    category:m.category,source:m.source||"",obtain:m.obtain||"external"}));
  return list;
}
function matAllName(id){const m=allMaterials().find(x=>x.id===id);return m?m.display:id;}
function matAllOptions(sel){
  return allMaterials().map(m=>`<option value="${m.id}" ${m.id===sel?"selected":""}>${esc(m.display)}</option>`).join("");
}
function matOptions(sel){
  return BOOT.tables.materials.targets.map(t=>{
    const d=t.display_name||t.name;
    return `<option value="${t.id}" ${t.id===sel?"selected":""}>${esc(d)}</option>`;}).join("");
}
function matName(id){return matAllName(id);}

/* ---------- 总览 ---------- */
async function renderOverview(){
  const st = BOOT.state, plan = await api("/api/plan").catch(e=>({error:e.message}));
  const compat = BOOT.compat, run = await api("/api/status");
  const today = run.today||{};
  const pend = run.pending||[];
  const limit = st.settings.daily_stamina_limit;
  const p = plan.plan||{}, steps = p.steps||[], d = p.detail;
  const planHtml = plan.error ? `<span class="tag err">${esc(plan.error)}</span>` :
    (steps.length ? `<table><tr><th>顺序</th><th>目标</th><th>轮数</th><th>体力</th><th>预计产出</th><th>缺口角色</th><th>为什么刷</th></tr>${
      steps.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${s.runs}</td><td>${s.stamina}</td><td>+${s.gain}</td><td class="muted">${esc(s.character)}</td><td class="muted" style="max-width:380px" title="${esc(s.reason?.text||"")}">${esc(s.reason?.text||"")}</td></tr>`).join("")
    }</table>` : `<div class="muted">${p.reason?`<span class="tag">${esc(p.no_op_reason||"")}</span> ${esc(p.reason)}`:"暂无可执行步骤"}</div>`);
  const budgetLine = d ? `<div class="muted" style="margin-top:6px">${esc(d.stamina_used_note||"")}；限额 ${d.stamina_limit}${d.hunter_reserved?` − 追猎预留 ${d.hunter_reserved}`:""} = 可规划 ${d.budget_total}，本计划安排 ${d.planned_stamina} 体力（${d.planned_runs} 轮），剩余 ${d.budget_remaining}。${(d.skipped_blacklisted||[]).length?` 当日拉黑跳过：${esc(d.skipped_blacklisted.join("、"))}。`:""}</div>` : "";
  const warns = (p.warnings||[]).map(w=>`<div class="tag warn">${esc(w)}</div>`).join(" ");
  const pendHtml = pend.length ? `<div class="card"><h3>未决执行（上次异常退出遗留，需手动对账）</h3>
    <table><tr><th>任务</th><th>计划</th><th>启动时间</th><th>PID</th><th>状态</th><th>处理</th></tr>${
      pend.map(p=>`<tr><td>${esc(p.step?.name??"?")}</td><td>${p.step?.runs??0}轮 / ${p.step?.stamina??0}体力</td>
      <td class="muted">${esc(p.started_at||"")}</td><td>${p.pid??""}</td>
      <td>${p.alive?`<span class="tag warn">仍在运行</span>`:`<span class="tag err">已结束·未记账</span>`}</td>
      <td><button class="btn mini" data-rid="${esc(p.execution_id||"")}" data-res="inventory_done">已核对库存</button>
      <button class="btn sec mini" data-rid="${esc(p.execution_id||"")}" data-res="discard">放弃记账</button></td></tr>
      <tr><td colspan="6" class="muted">${esc(p.reason||"结果未知")}</td></tr>`).join("")
    }</table>
    <div class="muted" style="margin-top:6px">处理前不会开始新的执行。请先按 ok-nte 日志/背包实际数量在『库存』页校准，再点“已核对库存”；若确定没刷或无需记账，点“放弃记账”（不修改库存与额度）。规划器绝不把预计产出当作实际产出。</div></div>` : "";
  $("#main").innerHTML = `
    <div class="card"><div class="row" style="justify-content:space-between">
      <div class="stat">
        <div><b>${today.used_stamina??0}<span class="muted" style="font-size:13px">/${limit}</span></b><span>今日已耗体力(含手动)</span></div>
        <div><b>${p.budget??0}</b><span>日常剩余额度</span></div>
        <div><b>${today.hunter_spent??0}<span class="muted" style="font-size:13px">/${st.settings.anomaly_hunter_stamina??180}</span></b><span>追猎已耗/额度</span></div>
      </div>
      <div class="row">
        <button class="btn" id="btnStart" ${(run.state==="running"||run.state==="waiting"||pend.length)?"disabled":""}>▶ 开始日常</button>
        <button class="btn" id="btnStartHunter" ${(run.state==="running"||run.state==="waiting"||pend.length)?"disabled":""}>🎯 开始追猎</button>
        <button class="btn sec" id="btnDry">👁 预演（不落盘）</button>
        <button class="btn danger" id="btnStop" ${(run.state!=="running"&&run.state!=="waiting")?"disabled":""}>■ 停止</button>
      </div>
    </div>
    <div class="muted" style="margin-top:8px">状态：<b id="runState">${esc(runStateText(run))}</b> <span id="waitInfo">${waitInfoText(run)}</span>
      <span class="muted">（日常与追猎共用一个执行器，同一时刻只跑一个；ok-nte 中两者互斥）</span></div>
    </div>
    ${pendHtml}
    <div class="card"><h3>日常体力计划${warns?" "+warns:""}</h3>${planHtml}${budgetLine}
      <div class="muted" style="margin-top:6px">策略：按角色优先级顺序补齐缺口；每次执行刷一个目标，完成自动切换下一个；ok-nte 的循环模式由本规划器接管（置为停用）。追猎已拆分为独立计划（下方）。</div>
    </div>
    <div class="card"><h3>追猎计划（独立开始；BOSS 每局 60 体力，掉落对应角色突破材料）</h3>
      <div class="row" style="gap:8px;margin-bottom:6px">
        <label>目标 BOSS</label>
        <select id="hBoss">${(BOOT.tables.materials.hunter_bosses||[]).map(b=>
          `<option ${st.settings.anomaly_hunter_target===b.name?"selected":""}>${esc(b.name)}</option>`).join("")}</select>
        <label>覆盖次数</label>
        <input type="number" id="hFixed" min="0" value="0" style="width:70px" title="0=按材料缺口自动；>0=本次固定打这么多局">
        <button class="btn sec mini" id="btnHunterPlan">生成追猎计划</button>
      </div>
      <div id="hunterBody"><div class="muted">点「生成追猎计划」预览（按所选 BOSS 掉落材料的缺口自动算局数，受追猎每日额度封顶）。</div></div>
      <div class="muted" style="margin-top:6px">对应材料缺口在『角色→直接材料需求』或『库存』里体现（如 海之泪←海囚）。</div>
    </div>
    <div class="card"><h3>未来 3 天预览（推演：体力恢复按每日限额假设，实际以游戏为准）</h3>
      <div class="row"><button class="btn sec" id="btnPreview">生成未来 3 天推演</button>
      <span id="pvStamina" class="muted"></span></div>
      <div id="pvBody" style="margin-top:8px"></div></div>
    <div id="dryCard" style="display:none" class="card"><h3>Dry Run 预演结果（纯读：不写文件、不启动 ok-nte、不改额度与库存）</h3><div id="dryBody"></div></div>
    <div class="card"><h3>执行日志</h3><div id="log"></div></div>`;
  $("#btnStart").onclick = ()=>startRun("daily");
  $("#btnStartHunter").onclick = startHunterRun;
  $("#btnDry").onclick = doDryRun;
  $("#btnPreview").onclick = doPreview;
  $("#btnHunterPlan").onclick = doHunterPlan;
  $("#btnStop").onclick = ()=>api("/api/stop").then(refreshStatus).catch(alertErr);
  drawLog(run.lines||[]);
}
async function doHunterPlan(){
  const body=$("#hunterBody");
  body.innerHTML='<div class="muted">推演中…</div>';
  try{
    const boss=encodeURIComponent($("#hBoss").value);
    const fixed=+$("#hFixed").value||0;
    const r=await api(`/api/hunter/plan?boss=${boss}&fixed_runs=${fixed}`);
    const steps=r.steps||[];
    body.innerHTML = steps.length
      ? `<table><tr><th>BOSS</th><th>掉落材料</th><th>局数</th><th>体力</th><th>预计产出</th><th>为什么</th></tr>${
        steps.map(s=>`<tr><td>${esc(s.boss)}</td><td>${esc(s.name)}</td><td>${s.runs}</td><td>${s.stamina}</td><td>+${s.gain}</td>
        <td class="muted" style="max-width:380px">${esc(s.reason?.text||"")}</td></tr>`).join("")}</table>
        <div class="muted" style="margin-top:4px">追猎额度：${r.detail?.hunter_limit??0} − 已耗 ${r.detail?.hunter_spent??0} = 可用 ${r.budget}。</div>`
      : `<div class="muted">${r.reason?`<span class="tag">${esc(r.no_op_reason||"")}</span> ${esc(r.reason)}`:"追猎无步骤"}</div>`;
  }catch(e){ body.innerHTML=`<span class="tag err">推演失败：${esc(e.message)}</span>`; }
}
async function doPreview(){
  const body=$("#pvBody"), stam=$("#pvStamina");
  body.innerHTML='<div class="muted">推演中…</div>';
  try{
    const r = await api("/api/preview?days=3");
    stam.textContent = r.projected_stamina_now!=null
      ? `当前体力估计：${r.projected_stamina_now}` : "（设置页填写\"当前体力\"后显示估计值）";
    const warns=(r.warnings||[]).map(w=>`<div class="tag warn">${esc(w)}</div>`).join(" ");
    const rows=r.days.map((d,i)=>`
      <tr><td>${esc(d.date)}${i===0?"（今天）":""}</td><td>${d.budget}</td>
      <td>${d.steps.length?d.steps.map(s=>`${esc(s.name)}×${s.runs}轮(${s.stamina}体力,+${s.gain})`).join("；"):`<span class="muted">无（未达标缺口为空${d.open_gaps?`，${d.open_gaps} 个缺口待续`:""}）</span>`}</td>
      <td>${d.remaining}</td></tr>`).join("");
    body.innerHTML=`${warns?`<div class="row" style="margin-bottom:6px">${warns}</div>`:""}
      ${r.complete_on?`<div class="muted" style="margin-bottom:6px">按此推演：<b>${esc(r.complete_on)}</b> 全部达标</div>`:`<div class="muted" style="margin-bottom:6px">3 天内无法全部达标（可增加天数视角：调整限额/目标）</div>`}
      <table><tr><th>日期</th><th>额度</th><th>安排</th><th>剩余</th></tr>${rows}</table>`;
  }catch(e){ body.innerHTML=`<span class="tag err">推演失败：${esc(e.message)}</span>`; }
}
async function doDryRun(){
  const card=$("#dryCard"), body=$("#dryBody");
  card.style.display="block";
  body.innerHTML='<div class="muted">预演中…</div>';
  try{
    const r = await api("/api/dry-run");
    if(!r.ok){
      body.innerHTML=`<span class="tag err">${esc(r.error||"预演失败")}</span>` +
        (r.compat?.problems?.length?`<div class="muted" style="margin-top:6px">${r.compat.problems.map(esc).join("；")}</div>`:"");
      return;
    }
    const steps=r.plan?.steps||[], s0=steps[0];
    let html="";
    if(s0){
      html+=`<div style="margin-bottom:8px">本轮将执行：<b>${esc(s0.name)}</b> × ${s0.runs} 轮（${s0.stamina} 体力，预计 +${s0.gain}）`+
        `；今日额度安排 ${r.plan.detail?`${r.plan.detail.planned_stamina}`:s0.stamina} 体力，剩余 ${r.plan.budget}。</div>`;
      if(r.patch){
        html+=`<div class="muted" style="margin-bottom:4px">将修改文件：<code>${esc(r.patch.file)}</code>（只列差异）</div>`+
          `<table><tr><th>配置段</th><th>字段</th><th>当前值</th><th>将改为</th></tr>${
            r.patch.diff.map(d=>`<tr><td>${esc(d.section)}</td><td>${esc(d.key)}</td><td class="muted">${esc(String(d.old??"（新增）"))}</td><td><b>${esc(String(d.new))}</b></td></tr>`).join("")
          }</table>`;
        if(r.hunter_note) html+=`<div class="muted" style="margin-top:4px">${esc(r.hunter_note)}</div>`;
      }
    }else{
      html=`<div class="muted">当前无需执行：${esc(r.plan?.reason||"")}</div>`;
    }
    if(r.oknte_running) html+=`<div class="tag warn" style="margin-top:6px">ok-nte 当前正在运行：真实执行会等其退出后再写配置</div>`;
    body.innerHTML=html;
  }catch(e){ body.innerHTML=`<span class="tag err">预演失败：${esc(e.message)}</span>`; }
}
function runStateText(run){
  const map={idle:"空闲",running:"运行中",stopping:"停止中",waiting:"等待中",done:"已完成",error:"出错"};
  const mode = run.mode==="hunter"?"【追猎】":run.mode==="daily"?"【日常】":"";
  let t = mode + (map[run.state]||run.state);
  if(run.message && run.state!=="waiting") t += ` — ${run.message}`;  // 等待中的详情由 waitInfoText 展示
  return t;
}
function waitInfoText(run){
  if(run.state!=="waiting") return "";
  let html = run.waiting_reason?`等待原因：${esc(run.waiting_reason)}`:"";
  if(run.next_retry_at){
    const target=new Date(String(run.next_retry_at).replace(" ","T"));
    if(!isNaN(target)){
      const left=Math.max(0,Math.ceil((target.getTime()-Date.now())/1000));
      html+=`${html?" · ":""}距下次重试 ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}（${esc(run.next_retry_at)}）`;
    }
  }
  return html?`<span class="tag warn">${html}</span>`:"";
}
function drawLog(lines){const el=$("#log"); if(!el)return; el.textContent=lines.join("\n")||"（暂无日志）"; el.scrollTop=el.scrollHeight;}
async function refreshStatus(){
  try{
    const run = await api("/api/status");
    const el=$("#runState"); if(el) el.textContent = runStateText(run);
    const w=$("#waitInfo"); if(w) w.innerHTML = waitInfoText(run);
    const b1=$("#btnStart"),bh=$("#btnStartHunter"),b2=$("#btnStop");
    const active = run.state==="running"||run.state==="waiting";
    if(b1) b1.disabled = active;
    if(bh) bh.disabled = active;
    if(b2) b2.disabled = !active;
    drawLog(run.lines||[]);
  }catch(e){}
}
async function startRun(mode){
  try{
    await api("/api/start",{mode});
    refreshStatus();
  }catch(e){alertErr(e);}
}
async function startHunterRun(){
  try{
    const boss=$("#hBoss")?.value;
    if(boss) await api("/api/settings",{anomaly_hunter_target:boss});
    await api("/api/start",{mode:"hunter",fixed_runs:+$("#hFixed")?.value||0});
    refreshStatus();
  }catch(e){alertErr(e);}
}
function alertErr(e){alert("操作失败："+e.message);}

/* ---------- 角色（含角色库/武器库） ---------- */
function libraryCard(title, key){
  const names=BOOT.state[key]||[];
  return `<div class="card"><div class="row" style="justify-content:space-between">
      <h3 style="margin:0">${esc(title)}</h3>
      <div class="row" style="gap:6px">
        <input class="lib-input" data-lib="${key}" placeholder="输入名字后添加" style="width:180px">
        <button class="btn sec mini" data-lib-add="${key}">＋ 添加</button>
      </div></div>
    <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:8px">
      ${names.length?names.map(n=>`<span class="tag">${esc(n)}

  if (c.status === "incompatible")
    tags.push(`<span class="tag err" title="${esc((c.problems||[]).join('；'))}">ok-nte 不兼容</span>`);
  else if (c.status === "compatible_with_warning")
    tags.push(`<span class="tag warn" title="${esc((c.warnings||[]).join('；'))}">ok-nte ${esc(c.version||"?")} 兼容(警告)</span>`);
  else
