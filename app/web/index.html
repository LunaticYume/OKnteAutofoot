<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>异环养成规划器 · OKnteAutofoot</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0b0f14; --panel:#131a22; --panel2:#1a232e; --panel3:#212d3b;
    --line:#223041; --line2:#2d3d51;
    --txt:#e6eef7; --dim:#8fa2b7; --faint:#5f7186;
    --acc:#53b6ff; --acc-deep:#1f6fbd; --acc-soft:rgba(83,182,255,.12);
    --ok:#3ecf8e; --warn:#f5b544; --err:#ff6b6b;
    --r:14px; --shadow:0 8px 28px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.65 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  b,strong{font-weight:600}
  ::selection{background:var(--acc-deep);color:#fff}

  /* ===== 布局骨架 ===== */
  .app{display:flex;min-height:100vh}
  .side{width:232px;flex-shrink:0;display:flex;flex-direction:column;background:var(--panel);
    border-right:1px solid var(--line);position:sticky;top:0;height:100vh;z-index:5}
  .logo{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
  .logo b{font-size:16px;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
  .logo b::before{content:"";width:26px;height:26px;border-radius:8px;flex-shrink:0;
    background:linear-gradient(135deg,var(--acc),var(--acc2,#7c5cff));
    box-shadow:0 0 14px rgba(83,182,255,.45)}
  .logo span{display:block;font-size:11px;color:var(--faint);margin-top:3px;padding-left:35px}
  nav#nav{display:flex;flex-direction:column;gap:2px;padding:12px 10px;flex:1;overflow-y:auto}
  nav#nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:none;border:1px solid transparent;color:var(--dim);padding:9px 12px;
    border-radius:10px;cursor:pointer;font-size:14px;transition:background .15s,color .15s}
  nav#nav button svg{width:17px;height:17px;flex-shrink:0}
  nav#nav button:hover{color:var(--txt);background:var(--panel2)}
  nav#nav button.on{color:var(--txt);background:var(--acc-soft);border-color:rgba(83,182,255,.35)}
  nav#nav button.on svg{color:var(--acc)}
  .side-foot{padding:12px 14px;border-top:1px solid var(--line);font-size:12px}
  .side-foot .tag{display:flex;justify-content:center;margin-bottom:6px}
  .side-foot .tag:last-child{margin-bottom:0}
  .content{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:baseline;gap:12px;padding:16px 24px 0;max-width:1200px;width:100%;margin:0 auto}
  .topbar h1{font-size:20px;margin:0;font-weight:650}
  .topbar .sub{color:var(--faint);font-size:12px}
  main{padding:14px 24px 40px;max-width:1200px;width:100%;margin:0 auto}
  @media (max-width:920px){
    .side{width:60px}
    .logo b{font-size:0;gap:0;justify-content:center}.logo b::before{margin:0}
    .logo span{display:none}
    nav#nav button{justify-content:center;padding:10px 0}
    nav#nav button svg{width:19px;height:19px}
    .side-foot{display:none}
  }

  /* ===== 卡片与通用 ===== */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 12px;font-size:14px;color:var(--txt);display:flex;align-items:center;gap:8px}
  .card h3::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--acc);flex-shrink:0}
  .card h3 .h-sub{font-size:12px;color:var(--faint);font-weight:normal}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:8px}
  .muted{color:var(--dim);font-size:12px}
  .num{font-variant-numeric:tabular-nums}
  .grow{flex:1}
  label{font-size:13px;color:var(--dim)}

  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:6px 10px;font-size:13px;outline:none;transition:border .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
  input[type=number]{width:90px}
  textarea{width:100%;min-height:300px;font-family:Consolas,monospace;font-size:12px}
  input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px;cursor:pointer}

  .btn{background:linear-gradient(180deg,#5fbfff,#3d9df0);border:none;color:#04121f;
    padding:8px 18px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:600;
    transition:filter .15s,transform .05s;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{filter:brightness(1.1)}
  .btn:active{transform:translateY(1px)}
  .btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line2);font-weight:normal}
  .btn.sec:hover{border-color:var(--acc);filter:none;background:var(--panel3)}
  .btn.danger{background:linear-gradient(180deg,#ff7d7d,#e85555);color:#210707}
  .btn.mini{padding:3px 10px;font-size:12px;border-radius:7px}
  .btn.big{padding:11px 26px;font-size:15px;border-radius:11px}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:none}

  .pill{display:inline-flex;align-items:center;gap:6px;padding:2px 11px;border-radius:999px;
    font-size:12px;font-weight:600;border:1px solid var(--line2);color:var(--dim);background:var(--panel2)}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .pill.run{color:var(--ok);border-color:rgba(62,207,142,.5);background:rgba(62,207,142,.08)}
  .pill.run::before{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .pill.wait{color:var(--warn);border-color:rgba(245,181,68,.5);background:rgba(245,181,68,.08)}
  .pill.wait::before{background:var(--warn)}
  .pill.err{color:var(--err);border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.08)}
  .pill.err::before{background:var(--err)}
  .pill.off{color:var(--err)}
  .pill.off::before{background:var(--err)}
  .pill.on{color:var(--ok)}
  .pill.on::before{background:var(--ok)}

  .tag{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;
    font-size:11.5px;border:1px solid var(--line2);color:var(--dim);background:var(--panel2)}
  .tag.ok{color:var(--ok);border-color:rgba(62,207,142,.45)}
  .tag.err{color:var(--err);border-color:rgba(255,107,107,.45)}
  .tag.warn{color:var(--warn);border-color:rgba(245,181,68,.45)}
  .tag.acc{color:var(--acc);border-color:rgba(83,182,255,.45)}

  .chip{display:inline-flex;align-items:center;padding:1px 9px;border-radius:7px;font-size:12px;
    background:var(--panel3);color:var(--txt);border:1px solid var(--line2);font-variant-numeric:tabular-nums}
  .chip.ok{color:var(--ok);border-color:rgba(62,207,142,.4);background:rgba(62,207,142,.07)}
  .chip.acc{color:var(--acc);border-color:rgba(83,182,255,.4);background:rgba(83,182,255,.07)}
  .chip.warn{color:var(--warn);border-color:rgba(245,181,68,.4);background:rgba(245,181,68,.07)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{color:var(--faint);font-weight:normal;font-size:12px;white-space:nowrap}
  tbody tr:hover{background:rgba(83,182,255,.04)}

  .banner{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;border-radius:10px;
    font-size:12.5px;margin:8px 0;border:1px solid}
  .banner.warn{color:var(--warn);border-color:rgba(245,181,68,.35);background:rgba(245,181,68,.06)}
  .banner.info{color:var(--dim);border-color:var(--line2);background:var(--panel2)}

  .empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 10px;
    color:var(--faint);font-size:13px;border:1px dashed var(--line2);border-radius:var(--r)}
  .empty svg{width:30px;height:30px;opacity:.5}

  /* ===== 总览 ===== */
  .hero{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;
    background:linear-gradient(120deg,var(--panel) 55%,rgba(83,182,255,.06))}
  .run-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .run-line b{font-size:16px}
  .hero .desc{color:var(--faint);font-size:12px;margin-top:6px;max-width:560px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-bottom:14px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
  .tile .t-main b{display:block;font-size:21px;font-variant-numeric:tabular-nums;line-height:1.25}
  .tile .t-main span{font-size:12px;color:var(--dim)}
  .ring{width:74px;height:74px;flex-shrink:0}
  .ring-bg{fill:none;stroke:var(--panel3);stroke-width:7}
  .ring-fg{fill:none;stroke:var(--acc);stroke-width:7;stroke-linecap:round;
    transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .6s}
  .ring-fg.hot{stroke:var(--warn)}
  .ring-fg.full{stroke:var(--err)}
  .ring-txt{fill:var(--txt);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

  .steps{display:flex;flex-direction:column}
  .step{display:flex;gap:12px;padding:10px 2px;border-bottom:1px dashed var(--line)}
  .step:last-child{border-bottom:none}
  .step-n{width:24px;height:24px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;background:var(--acc-soft);color:var(--acc);font-size:12.5px;font-weight:700;
    border:1px solid rgba(83,182,255,.35);margin-top:2px}
  .step-main{flex:1;min-width:0}
  .step-reason{color:var(--dim);font-size:12px;margin-top:3px}

  .pend-item{border:1px solid rgba(245,181,68,.35);background:rgba(245,181,68,.05);
    border-radius:12px;padding:10px 14px;margin-bottom:8px}
  .pend-item:last-child{margin-bottom:0}

  .term{background:#080c11;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    height:250px;overflow-y:auto;font:12px/1.75 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap}
  .term .ln{color:#a9bcd0}
  .term .ln.ok{color:var(--ok)}
  .term .ln.warn{color:var(--warn)}
  .term .ln.err{color:var(--err)}
  .term::-webkit-scrollbar{width:8px}
  .term::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}

  .pv-days{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
  .pv-day{border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:var(--panel2)}
  .pv-day.today{border-color:rgba(83,182,255,.5);background:var(--acc-soft)}
  .pv-day .pv-date{font-weight:600;font-size:13px}
  .pv-day .pv-budget{font-size:12px;color:var(--acc);margin:2px 0 6px;font-variant-numeric:tabular-nums}
  .pv-day .pv-steps{font-size:12px;color:var(--dim);min-height:34px}
  .pv-day .pv-foot{font-size:11.5px;color:var(--faint);margin-top:6px;font-variant-numeric:tabular-nums}

  /* ===== 角色卡 ===== */
  .char{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;
    background:var(--panel);transition:border-color .15s}
  .char:hover{border-color:var(--line2)}
  .char .head{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--panel2);flex-wrap:wrap}
  .char .body{padding:12px 14px;display:none;border-top:1px solid var(--line)}
  .char.open .body{display:block}
  .need-row{display:grid;grid-template-columns:2fr 70px 70px 70px 60px;gap:6px;align-items:center}
  .lib-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 6px 3px 11px;border-radius:999px;
    background:var(--panel3);border:1px solid var(--line2);font-size:12.5px}
  .lib-chip button{border:none;background:none;color:var(--err);cursor:pointer;font-size:14px;
    padding:0 5px;border-radius:50%;line-height:1}
  .lib-chip button:hover{background:rgba(255,107,107,.15)}

  /* ===== 开关 ===== */
  .switch{position:relative;display:inline-flex;align-items:center;cursor:pointer;flex-shrink:0}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch .sl{width:38px;height:21px;border-radius:999px;background:var(--panel3);
    border:1px solid var(--line2);position:relative;transition:background .15s}
  .switch .sl::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;
    border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
  .switch input:checked+.sl{background:var(--acc-deep);border-color:var(--acc-deep)}
  .switch input:checked+.sl::after{transform:translateX(17px);background:#fff}
  .set-row{display:flex;align-items:center;gap:12px;margin-bottom:11px;flex-wrap:wrap}
  .set-row>label:first-child{width:170px;flex-shrink:0;text-align:right}
  .set-row .note{font-size:12px;color:var(--faint);flex:1;min-width:200px}
  @media (max-width:700px){.set-row>label:first-child{width:100%;text-align:left}}

  .kv{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
  .mat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:8px}
  .mat-item{display:flex;gap:8px;align-items:center;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:7px 10px}
  .mat-item label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ===== Toast 与对话框 ===== */
  #toasts{position:fixed;right:18px;top:18px;z-index:99;display:flex;flex-direction:column;gap:8px}
  .toast{background:var(--panel3);border:1px solid var(--line2);border-left:3px solid var(--acc);
    color:var(--txt);padding:10px 16px;border-radius:10px;font-size:13px;max-width:380px;
    box-shadow:var(--shadow);animation:tin .25s ease}
  .toast.ok{border-left-color:var(--ok)}
  .toast.err{border-left-color:var(--err)}
  .toast.out{opacity:0;transform:translateX(12px);transition:all .3s}
  @keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
  .modal-ov{position:fixed;inset:0;background:rgba(4,8,12,.62);z-index:98;display:flex;
    align-items:center;justify-content:center;backdrop-filter:blur(2px)}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;
    padding:20px 22px;max-width:440px;width:calc(100% - 40px);box-shadow:var(--shadow)}
  .modal-msg{font-size:13.5px;line-height:1.7;white-space:pre-wrap}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><b>异环养成规划器</b><span>OKnteAutofoot · 不改 ok-nte 源码</span></div>
    <nav id="nav">
      <button data-t="overview" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg><span>总览</span></button>
      <button data-t="chars"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>角色</span></button>
      <button data-t="arc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><span>弧盘</span></button>
      <button data-t="nullmux"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18"/><path d="M12 3v18"/></svg><span>空幕</span></button>
      <button data-t="teams"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>配队</span></button>
      <button data-t="codex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span>图鉴数据</span></button>
      <button data-t="common"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3h15"/><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"/><path d="M6 14h12"/></svg><span>通用材料</span></button>
      <button data-t="inv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg><span>库存</span></button>
      <button data-t="tables"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M12 3v18"/></svg><span>数据表</span></button>
      <button data-t="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span>设置</span></button>
      <button data-t="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>历史</span></button>
      <button data-t="logs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>日志</span></button>
    </nav>
    <div class="side-foot" id="envTags"></div>
  </aside>
  <div class="content">
    <header class="topbar"><h1 id="pageTitle">总览</h1><span class="sub" id="pageSub"></span></header>
    <main id="main"></main>
  </div>
</div>
<div id="toasts"></div>

<script>
"use strict";
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let BOOT=null, TIMER=null;

/* ---------- Toast 与对话框（替代 alert/confirm） ---------- */
function toast(msg, kind="ok"){
  const host=document.getElementById("toasts");
  const t=document.createElement("div");
  t.className="toast "+kind; t.textContent=msg;
  host.appendChild(t);
  setTimeout(()=>{t.classList.add("out");setTimeout(()=>t.remove(),320);},3400);
}
function alertErr(e){toast("操作失败："+e.message,"err");}
function qConfirm(msg){
  return new Promise(res=>{
    const ov=document.createElement("div"); ov.className="modal-ov";
    ov.innerHTML=`<div class="modal"><div class="modal-msg"></div>
      <div class="row" style="justify-content:flex-end;margin:16px 0 0">
      <button class="btn sec" data-q="0">取消</button><button class="btn" data-q="1">确定</button></div></div>`;
    ov.querySelector(".modal-msg").textContent=msg;
    const done=v=>{ov.remove();res(v);};
    ov.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>done(b.dataset.q==="1"));
    ov.onclick=e=>{if(e.target===ov)done(false);};
    document.body.appendChild(ov);
  });
}

async function api(path, body){
  const opt = body===undefined ? {} : {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)};
  // 本地面板不该有请求挂死：15 秒超时兜底，失败走「加载失败」横幅而不是无限空白
  const res = await fetch(path, {...opt, signal: AbortSignal.timeout(15000)});
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||res.status);
  return data;
}

function ringSvg(pct){

  return `<svg class="ring" viewBox="0 0 84 84">
    <circle cx="42" cy="42" r="${r}" class="ring-bg"/>
    <circle cx="42" cy="42" r="${r}" class="${cls}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p)).toFixed(1)}"/>
    <text x="42" y="47" text-anchor="middle" class="ring-txt">${Math.round(p*100)}%</text></svg>`;

function stateShort(run){
  const map={idle:"空闲",running:"运行中",stopping:"停止中",waiting:"等待中",done:"已完成",error:"出错",interrupted:"已中断"};
  const mode = run.mode==="hunter"?"【追猎】":run.mode==="daily"?"【日常】":"";
  return mode + (map[run.state]||run.state);
}
function waitInfoText(run){
  if(run.state!=="waiting") return "";
  let html = run.waiting_reason?`等待原因：${esc(run.waiting_reason)}`:"";
  if(run.next_retry_at){
    const target=new Date(String(run.next_retry_at).replace(" ","T"));
    if(!isNaN(target)){
      const left=Math.max(0,Math.ceil((target.getTime()-Date.now())/1000));
      html+=`${html?" · ":""}距下次重试 <b class="num">${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</b>（${esc(run.next_retry_at)}）`;
    }
  }
  return html?`<div class="banner warn">${html}</div>`:"";
}
function drawLog(lines){
  const el=$("#log"); if(!el)return;
  el.innerHTML = lines.length? lines.map(l=>{
    const e=esc(l);
    if(/失败|错误|error/i.test(l)) return `<div class="ln err">${e}</div>`;
    if(/等待|重试|警告|warn/i.test(l)) return `<div class="ln warn">${e}</div>`;
    if(/完成|成功|已备份|已开始|已校准/.test(l)) return `<div class="ln ok">${e}</div>`;
    return `<div class="ln">${e}</div>`;
  }).join("") : '<span class="muted">（暂无日志）</span>';
  el.scrollTop=el.scrollHeight;
}
function statePillClass(run){
  if(run.state==="running") return "pill run";
  if(run.state==="waiting"||run.state==="stopping") return "pill wait";
  if(run.state==="error"||run.state==="interrupted") return "pill err";
  return "pill";
}

function seriesOptions(prefix, count, cur, onlyN){
  /* ability_N/arc_N/console_N 的可读名全部来自 materials targets（雏鸟系/戏剧芯/钟表把戏…）；
     onlyN=数字时只显示该系（角色适配过滤），未定系则显示全部 */
  const targets=(BOOT.tables.materials||{}).targets||[];
  const out=[];
  for(let n=1;n<=count;n++){
    if(onlyN && n!==onlyN) continue;
    const id=`${prefix}_${n}`;
    const t=targets.find(x=>x.id===id);
    const label=t?(t.display_name||t.name):id;
    out.push(`<option value="${n}" ${+cur===n?"selected":""}>${esc(label)}</option>`);
  }
  return out.join("");
}
function abilityOptionsFor(c){
  /* 角色属性 → 书系（attribute_to_skill_series 权威映射 + 个体 skill_series）：
     已确定时只显示适配系；属性缺失时显示全部 5 系 */
  const a2s=(window.__A2S__||{});
  const attr=c.attribute||"";
  const series=c.skill_series||(attr?a2s[attr]:null);
  return seriesOptions("ability", 5, c.mats?.ability, series?+String(series).replace("ability_",""):null);
}

/* ---------- 弧盘（武器中心：适配过滤 + 搜索 + S/A 排序 + 材料按目标计算） ---------- */
async function renderArc(){
  const tracks = BOOT.tables.requirements.tracks||{};
  const chars = BOOT.state.characters||[];
  const gd = await api("/api/game-data").catch(()=>({}));
  const weaponMeta = {};  // 目录武器名 → {matter_state, rarity}（B 级忽略）
  (gd.weapons||[]).forEach(w=>{
    if(w && w.name && (w.rarity==="S" || w.rarity==="A"))
      weaponMeta[w.name] = {matter_state: w.matter_state||"", rarity: w.rarity||"A"};
  });
  const state_to_can = gd.matter_state_to_can||{};
  const targets = (BOOT.tables.materials||{}).targets||[];
  const arcDisplayName = n => { const t=targets.find(x=>x.id===`arc_${n}`); return t?(t.display_name||t.name):`arc_${n}`; };
  const snap = await api("/api/status").catch(()=>null);
  const rowsByChar = {};
  if(snap && snap.snapshot) (snap.snapshot.characters||[]).forEach(c=>{ rowsByChar[c.name] = c.rows||[]; });
  const gapOf = (name, matId) => {
    const row = (rowsByChar[name]||[]).find(x=>x.mat_id===matId);
    return row ? {need:row.need, have:row.have, gap:row.gap, runs:row.runs} : null;
  };
  $("#main").innerHTML=`
    <div class="banner info">每行 = 一个角色的<b>弧盘目标</b>：下拉只显示与角色物态<b>适配</b>的弧盘（S→A 排序，可搜索）；罐头系随物态自动派生；材料按填写的等级目标计算。</div>
    <div id="arcList"></div>
    <div class="row" style="margin-top:12px"><button class="btn big" id="saveArc">保存弧盘</button>
      <span class="muted">想要的弧盘不在列表？到「图鉴数据」页登记</span></div>`;
  const host=$("#arcList");
  if(!chars.length){ host.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>还没有角色，先到「角色」页添加</div>`; return; }
  chars.forEach(c=>host.appendChild(arcCard(c, tracks, weaponMeta, state_to_can, arcDisplayName, gapOf)));
  $("#saveArc").onclick = async ()=>{
    const charsOut = BOOT.state.characters.map(c=>{
      const el = document.querySelector(`.char[data-cid="${c.id}"]`);
      if(!el || !el.querySelector(".a-weapon")) return c;
      const weapon = el.querySelector(".a-weapon").value||"";
      const mats = {...(c.mats||{})};
      const meta = weaponMeta[weapon];
      if(meta){
        const can2 = state_to_can[meta.matter_state];
        if(can2) mats.arc = +String(can2).replace("arc_","")||mats.arc;
      }
      const tracksOut = {...(c.tracks||{})};
      el.querySelectorAll("[data-track]").forEach(inp=>{
        tracksOut[inp.dataset.track]=tracksOut[inp.dataset.track]||{};
        tracksOut[inp.dataset.track][inp.dataset.tk]=+inp.value||0;});
      return {...c, weapon, mats, tracks:tracksOut};
    });
    try{ const r=await api("/api/characters",{characters:charsOut});
      BOOT.state.characters=r.characters||charsOut;
      toast("弧盘已保存");
      renderArc();
    }catch(e){alertErr(e);}
  };
}
function arcWeaponOptions(c, weaponMeta, term){
  /* 只显示与角色物态适配的弧盘（角色物态未知时全显示）+ 武器库实例 + 自定义；
     S→A 排序；term 搜索过滤 */
  const libNames=[...new Set(BOOT.state.weapon_library||[])];
  const all=[...libNames.map(n=>({name:n, from:"lib"})),
             ...Object.keys(weaponMeta).filter(n=>!libNames.includes(n))
                      .map(n=>({name:n, from:"cat", rarity:weaponMeta[n].rarity, ms:weaponMeta[n].matter_state}))];
  const 适配 = c.matter_state||"";
  const rank = r => r==="S"?0:r==="A"?1:2;
  let rows = all.map(x=>({...x, rarity: x.rarity || "", ms: x.ms || ""}));
  if(适配) rows = rows.filter(x=>!x.ms || x.ms===适配 || x.from==="lib");
  if(term) rows = rows.filter(x=>x.name.toLowerCase().includes(term.toLowerCase()));
  rows.sort((a,b)=> (rank(a.rarity)-rank(b.rarity)) || a.name.localeCompare(b.name,"zh"));
  let opts=`<option value="" ${!c.weapon?"selected":""}>（未选择弧盘）</option>`;
  rows.forEach(x=>{
    const tag=x.rarity?`（${x.rarity}）`:"";
    opts+=`<option value="${esc(x.name)}" ${x.name===c.weapon?"selected":""}>${esc(x.name)}${tag}</option>`;});
  if(c.weapon && !rows.some(x=>x.name===c.weapon))
    opts+=`<option value="${esc(c.weapon)}" selected>${esc(c.weapon)}（自定义）</option>`;
  return opts;
}
function arcCard(c, tracks, weaponMeta, state_to_can, arcDisplayName, gapOf){
  const div=document.createElement("div");
  div.className="char open"; div.dataset.cid=c.id;
  const derive = weapon => {
    const meta = weaponMeta[weapon];
    if(!meta) return null;
    const can2 = state_to_can[meta.matter_state];
    return can2 ? +String(can2).replace("arc_","") : null;
  };
  let can = derive(c.weapon) || c.mats?.arc || 1;
  const arcT = tracks.arc_level||{max:80};
  const arcRow = () => gapOf(c.name, `arc_${can}`);
  const matTxt = row => row?`需 ${row.need} / 持 ${row.have} / 差 ${row.gap} / 约 ${row.runs} 轮`:"无记录";
  const 适配态 = c.matter_state ? "" : "（角色未填物态：显示全部）";
  div.innerHTML=`
    <div class="head" style="flex-wrap:wrap">
      <b class="arc-title">${esc(c.weapon||"（未选弧盘）")}</b>
      <span class="tag acc arc-rarity">${esc((weaponMeta[c.weapon]||{}).rarity||"?")}</span>
      <span class="muted">绑定角色</span><b>${esc(c.name)}</b>
      <span class="grow"></span>
      <input class="a-search" placeholder="🔍 搜索弧盘" style="width:130px">
      <span class="muted">选择弧盘</span>
      <select class="a-weapon" style="max-width:260px">${arcWeaponOptions(c, weaponMeta, "")}</select>
      <button class="btn sec mini" data-act="maxArc">弧盘满级</button>
    </div>
    <div class="body" style="display:block">
      <div class="row" style="gap:6px;margin-bottom:6px">
        <span class="muted">物态→罐头系（自动）</span>
        <span class="chip acc arc-can-chip">${esc(arcDisplayName(can))}</span>
        <span class="muted">弧盘等级</span>
        <input type="number" data-track="arc_level" data-tk="cur" value="${c.tracks?.arc_level?.cur??1}" min="0" style="width:70px"> <span class="muted">→</span>
        <input type="number" data-track="arc_level" data-tk="tgt" value="${c.tracks?.arc_level?.tgt??1}" min="0" max="${arcT.max??80}" style="width:70px">
        <span class="chip num arc-mat-chip">弧盘材料：${matTxt(arcRow())}</span>
      </div>
      ${适配态?`<div class="banner info">${适配态}</div>`:""}
    </div>`;
  const searchEl=div.querySelector(".a-search");
  searchEl.oninput=()=>{

let NULLMUX_CASSETTES = null;
async function renderNullmux(){
  if(!NULLMUX_CASSETTES){
    const r=await api("/api/wiki/cassettes").catch(()=>null);
    if(r && r.sets){ NULLMUX_CASSETTES=r; }
  }
  const sets=(NULLMUX_CASSETTES||{}).sets||[];
  const mainStats=(NULLMUX_CASSETTES||{}).main_stats||[];
  const subStats=(NULLMUX_CASSETTES||{}).sub_stats||[];
  const driverMains=(NULLMUX_CASSETTES||{}).driver_main_stats||["攻击力","生命值"];
  const chars=BOOT.state.characters||[];
  const elemOf=c=>({光:"光系",暗:"暗系",灵:"灵系",咒:"咒系",相:"相系",魂:"魂系"}[c.attribute]||"");
  const suitOpts=(c,cur)=>{
    const el=elemOf(c);
    const fit=sets.filter(x=>el && x.element===el);
    const generic=sets.filter(x=>x.element==="泛用");
    const others=sets.filter(x=>!fit.includes(x)&&!generic.includes(x));
    let out=`<option value="" ${!cur?"selected":""}>（未选择卡带）</option>`;
    [...fit,...generic,...others].forEach(x=>{
      out+=`<option value="${esc(x.name)}" ${x.name===cur?"selected":""}>${esc(x.name)}${x.element&&x.element!=="泛用"?`（${esc(x.element)}）`:"（泛用）"}</option>`;});
    return out.join("");
  };
  const statOpts=(list,cur)=>`<option value="" ${!cur?"selected":""}>（未选择）</option>`+list.map(x=>`<option ${x===cur?"selected":""}>${esc(x)}</option>`).join("");
  $("#main").innerHTML=`
    <div class="banner info">空幕装备 = <b>1 张卡带</b>（主属性×1 + 副词条×4，按角色属性适配）+ <b>多个驱动块</b>（主属性固定 攻击力+生命值，只记录）。
      角色旁仅展示最佳 2-3 组词条。${sets.length?`已载入 ${sets.length} 套卡带`:"（卡带数据未抓取：点下方按钮从 wiki 拉取）"}</div>
    <div class="card"><div class="row">
      <button class="btn sec mini" id="btnFetchCassette">${sets.length?"🔄 重新拉取卡带数据":"🌐 从 wiki 拉取卡带数据"}</button>
      <span class="muted" id="cassetteFetchInfo"></span></div></div>
    <div id="nmList">${chars.length?chars.map(c=>nullmuxCard(c,sets,mainStats,subStats,driverMains,suitOpts,statOpts)).join(""):""}</div>
    <div class="row" style="margin-top:12px"><button class="btn big" id="saveNm">保存空幕记录</button></div>`;
  if(!chars.length) $("#nmList").innerHTML=`<div class="empty">还没有角色</div>`;
  $("#btnFetchCassette").onclick=async()=>{
    const btn=$("#btnFetchCassette"); btn.disabled=true; btn.textContent="拉取中…（约 15 秒）";
    try{ const fr=await fetch("/api/wiki/fetch-cassettes",{method:"POST",signal:AbortSignal.timeout(120000)});
      const d=await fr.json(); toast(d.ok?`已抓取 ${d.sets} 套卡带`:(d.error||"拉取失败"), d.ok?"ok":"err");
      NULLMUX_CASSETTES=null; renderNullmux();
    }catch(e){alertErr(e); btn.disabled=false; btn.textContent="🌐 从 wiki 拉取卡带数据";}
  };
  $("#saveNm").onclick=async()=>{
    const charsOut=BOOT.state.characters.map(c=>{
      const el=document.querySelector(`.nm-card[data-cid="${c.id}"]`);
      if(!el) return c;
      const cassette={set:el.querySelector(".nm-set").value||null, main:el.querySelector(".nm-main").value||null};
      const drivers=[...el.querySelectorAll(".nm-driver")].map(row=>({
        shape:row.querySelector(".d-shape").value, quality:row.querySelector(".d-quality").value,
        main:row.querySelector(".d-main").value, subs:[...row.querySelectorAll(".d-sub")].map(x=>x.value||"").slice(0,4)}))
        .filter(d=>d.shape);
      return {...c, cassette, drivers};
    });
    try{ const r=await api("/api/characters",{characters:charsOut});
      BOOT.state.characters=r.characters||charsOut; toast("空幕记录已保存"); renderNullmux();
    }catch(e){alertErr(e);}
  };
}

/* ---------- 库存 ---------- */
function renderInv(){
  const inv=BOOT.state.inventory||{};
  const cats={};
  allMaterials().forEach(m=>{(cats[m.category]=cats[m.category]||[]).push(m);});
  const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  $("#main").innerHTML=`
    <div class="card"><h3>材料库存<span class="h-sub">全量材料：体力本 + BOSS掉落/周本/小怪等外部来源；先按背包实际填写，之后规划器自动累加</span></h3>
    <div class="row" style="margin-bottom:10px">
      <button class="btn sec mini" id="btnOcr">📷 抓取背包（实验）</button>
      <span class="muted">截屏识别游戏窗口文字 → 命中的材料预填为<b>黄色边框</b> → 请核对后保存；识别不了就手填</span></div>
    ${Object.entries(cats).map(([cat,items])=>`
      <div style="font-size:13px;color:var(--faint);margin:12px 0 8px">${esc(cat)}</div>
      <div class="mat-grid">
      ${items.map(m=>`<div class="mat-item">
        <label title="${esc(m.source)}">${esc(m.display)}</label>${obtainTag(m.obtain)}
        <input type="number" min="0" data-inv="${m.id}" value="${inv[m.id]??0}"></div>`).join("")}
      </div>`).join("")}
    </div>
    <div class="row"><button class="btn big" id="saveInv">保存库存</button></div>`;
  $("#btnOcr").onclick=async()=>{
    const btn=$("#btnOcr"); btn.disabled=true; const old=btn.textContent;
    btn.textContent="识别中…（请保持游戏窗口可见）";
    try{
      const r=await api("/api/inventory/ocr", {});
      const text=r.text||"";
      let hits=0;
      document.querySelectorAll("[data-inv]").forEach(inp=>{
        const label=(inp.closest(".mat-item")?.querySelector("label")?.textContent||"").trim();
        if(!label) return;
        const candidates=[label, label.split("（")[0]].filter(c=>c.length>=2);
        for(const candidate of candidates){
          const m=new RegExp(escRe(candidate)+"\\D{0,14}(\\d{1,9})").exec(text);
          if(m){ const v=+m[1];
            if(v>=0 && String(inp.value)!==String(v)){ inp.value=v; inp.style.borderColor="var(--warn)"; hits++; }
            break;
          }
        }
      });
      toast(hits?`OCR 命中 ${hits} 项已预填（黄色边框），请核对后保存`:"OCR 未识别到已知材料名", hits?"ok":"err");
    }catch(e){alertErr(e);}
    finally{ btn.disabled=false; btn.textContent=old; }
  };
  $("#saveInv").onclick=async()=>{
    const inventory={};
    document.querySelectorAll("[data-inv]").forEach(inp=>{const v=+inp.value||0; if(v>0)inventory[inp.dataset.inv]=v;});
    try{const r=await api("/api/inventory",{inventory});BOOT.state.inventory=r.inventory||inventory;toast("库存已保存");}catch(e){alertErr(e);}
  };
}

function buildReqEditor(){
  const req=BOOT.tables.requirements, host=$("#reqEditor");
  const generic=new Map(GENERIC_MATS);
  const matLabel=id=>generic.get(id)||matAllName(id);
  const matOpts=sel=>[...generic.entries()].map(([k,label])=>
      `<option value="${k}" ${k===sel?"selected":""}>${esc(label)}</option>`).join("")
    +allMaterials().map(m=>`<option value="${m.id}" ${m.id===sel?"selected":""}>${esc(m.display)}</option>`).join("");
  host.innerHTML=Object.entries(req.tracks||{}).map(([key,t])=>`
    <div class="char open" data-track-edit="${key}">
      <div class="head">
        <input class="t-name" value="${esc(t.name||key)}" style="width:130px" title="轨道名">
        <span class="muted">上限</span><input class="t-max" type="number" value="${t.max??999}" style="width:70px">
        <span class="grow"></span>
        <button class="btn sec mini" data-act="addBand">＋ 添加等级段</button>
      </div>
      <div class="body" style="display:block">
        ${(t.ladder||[]).map(b=>bandRow(b)).join("")||`<div class="muted band-empty">（暂无等级段：本轨道不参与换算，可在角色『直接材料需求』里手填）</div>`}
      </div>
    </div>`).join("");
  function bandRow(b){
    return `<div class="band-row card" style="margin:6px 0;padding:10px;box-shadow:none">
      <div class="row" style="gap:6px;margin-bottom:6px">
        <span class="muted">从</span><input class="b-from" type="number" value="${b?.from??1}" style="width:70px">
        <span class="muted">到</span><input class="b-to" type="number" value="${b?.to??10}" style="width:70px">
        <span class="grow"></span>
        <button class="btn sec mini" data-act="addBandItem">＋ 材料</button>
        <button class="btn sec mini" data-act="delBand">删除本段</button>
      </div>
      <div class="grid band-items">
      ${Object.entries(b?.items||{}).map(([mat,cnt])=>bandItem(mat,cnt)).join("")
        ||`<div class="muted">（未配置材料）</div>`}
      </div>
    </div>`;
  }
  function bandItem(mat,cnt){
    return `<div class="row band-item" style="gap:6px">
      <select style="flex:1">${matOpts(mat)}</select>
      <input type="number" value="${cnt}" min="0" style="width:100px" placeholder="数量">
      <button class="btn sec mini" data-act="delItem">×</button></div>`;
  }
  host.querySelectorAll('[data-act="addBand"]').forEach(btn=>btn.onclick=()=>{
    const card=btn.closest("[data-track-edit]");
    const body=card.querySelector(".body");
    body.querySelector(".band-empty")?.remove();
    body.insertAdjacentHTML("beforeend",bandRow({from:1,to:10,items:{}}));
    bindBandButtons(card);
  });
  function bindBandButtons(scope){
    scope.querySelectorAll('[data-act="delBand"]').forEach(btn=>btn.onclick=()=>btn.closest(".band-row").remove());
    scope.querySelectorAll('[data-act="addBandItem"]').forEach(btn=>btn.onclick=()=>{
      const items=btn.closest(".band-row").querySelector(".band-items");
      items.querySelector(".muted")?.remove();
      items.insertAdjacentHTML("beforeend",bandItem("exp_char",0));
      bindBandButtons(scope);
    });
    scope.querySelectorAll('[data-act="delItem"]').forEach(btn=>btn.onclick=()=>btn.closest(".band-item").remove());
  }
  bindBandButtons(host);
}

/* ---------- 历史 ---------- */
function historyChart(history){
  const days = {};
  (history||[]).forEach(h=>{const d=days[h.day]=days[h.day]||{s:0,g:0,n:0};
    d.s+=h.stamina||0; d.g+=h.gain||0; d.n++;});
  const list = Object.entries(days).sort((a,b)=>a[0]<b[0]?-1:1).slice(-14);
  if(!list.length) return "";
  const W=680,H=150,pad=28,bw=Math.max(8,(W-pad*2)/list.length-6);
  const maxV=Math.max(1,...list.map(([,d])=>Math.max(d.s,d.g)));
  const bars=list.map(([day,d],i)=>{
    const x=pad+i*((W-pad*2)/list.length)+( (W-pad*2)/list.length-bw)/2;
    const hs=Math.round((H-30)*d.s/maxV), hg=Math.round((H-30)*d.g/maxV);
    const t=`title="${day}：体力 ${d.s} / 产出 +${d.g}（${d.n} 次执行）"`;
    return `<rect x="${x}" y="${H-22-hs}" width="${bw/2-1}" height="${hs}" rx="2" fill="#53b6ff" ${t}/>
      <rect x="${x+bw/2+1}" y="${H-22-hg}" width="${bw/2-1}" height="${hg}" rx="2" fill="#3ecf8e" ${t}/>
      <text x="${x+bw/2}" y="${H-8}" fill="#5f7186" font-size="9" text-anchor="middle">${day.slice(5)}</text>`;
  }).join("");
  return `<div class="card"><h3>最近 14 天<span class="h-sub">每日体力消耗 / 预计产出，悬停看明细</span></h3>
    <svg width="${W}" height="${H}" style="max-width:100%">${bars}
      <text x="${pad}" y="14" fill="#53b6ff" font-size="11">■ 体力消耗</text>
      <text x="${pad+90}" y="14" fill="#3ecf8e" font-size="11">■ 预计产出</text></svg></div>`;
}
function statusTag(st){
  const map={done:["ok","完成"],short:["warn","体力不足"],skipped:["warn","跳过"],
    failed:["err","失败"],reconciled:["acc","已对账"]};
  const m=map[st]||["",""];
  return m[0]?`<span class="tag ${m[0]}">${m[1]}</span>`:`<span class="tag">${esc(st)}</span>`;
}
async function renderHistory(){
  const r=await api("/api/history");
  const chart=historyChart(r.history);
  const rows=(r.history||[]).slice().reverse().map(h=>{
    const actualCell = h.status!=="done" ? `<span class="muted">—</span>` :
      (h.actual_gain!==undefined
        ? `<b class="num">${h.actual_gain}</b> <span class="muted">(${esc(h.confirmed_at||"已确认")})</span>`
        : `<span class="row" style="gap:4px"><input type="number" min="0" style="width:70px" placeholder="实际" data-cf-day="${esc(h.day)}" data-cf-time="${esc(h.time)}" data-cf-mat="${esc(h.mat_id)}">
           <button class="btn sec mini" data-cf="1">确认</button></span>`);
    return `<tr><td class="muted num">${esc(h.day)} ${esc(h.time)}</td><td><b>${esc(h.name)}</b></td><td class="num">${h.runs}</td>
    <td class="num">${h.stamina}</td><td class="num">${h.gain>0?"+"+h.gain:"-"}</td><td>${actualCell}</td>
    <td>${statusTag(h.status)}</td>
    <td class="muted" style="max-width:260px">${esc(h.note||"")}</td></tr>`;}).join("");
  const sug = await api("/api/yield-suggestions").catch(()=>({suggestions:[]}));
  const sugRows=(sug.suggestions||[]).map(s=>`
    <tr><td><b>${esc(s.name)}</b></td><td class="num">${s.configured_yield}</td>
    <td class="num">${s.confirmed_runs} 轮 / ${s.confirmed_gain} 个</td>
    <td class="num"><b>${s.measured_yield}</b></td><td class="num"><b>${s.suggested_yield}</b></td>
    <td>${s.suggested_yield!==s.configured_yield
      ?`<button class="btn mini" data-apply-mat="${esc(s.mat_id)}" data-apply-val="${s.suggested_yield}">应用</button>`
      :`<span class="tag ok">一致</span>`}</td></tr>`).join("");
  const sugCard=(sug.suggestions||[]).length?`<div class="card"><h3>产量校准建议<span class="h-sub">基于已确认实际获得；只建议，应用后走产量表通道</span></h3>
    <table><tr><th>材料</th><th>当前产量</th><th>已确认累计</th><th>实测每轮</th><th>建议值</th><th>操作</th></tr>${sugRows}</table>
    <div class="muted" style="margin-top:8px">measured = Σ实际获得 ÷ Σ轮数（全部已确认的完成记录）；应用 = 把该材料的每轮产出改为建议值。样本少时建议先多确认几条再看。</div></div>`:"";
  $("#main").innerHTML=`${chart}${sugCard}<div class="card"><h3>执行历史<span class="h-sub">最近 200 条</span></h3>
    ${rows?`<table><tr><th>时间</th><th>目标</th><th>轮数</th><th>体力</th><th>预计产出</th><th>实际获得</th><th>结果</th><th>备注</th></tr>${rows}</table>`
      :`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>还没有执行记录</div>`}</div>`;
  document.querySelectorAll("[data-cf]").forEach(btn=>btn.onclick=async()=>{
    const wrap=btn.closest(".row");
    const inp=wrap.querySelector("input[data-cf-day]");
    const v=+inp.value;
    if(!(v>=0)){toast("请填写非负整数","err");return;}
    try{
      const res=await api("/api/history/confirm",{day:inp.dataset.cfDay,time:inp.dataset.cfTime,mat_id:inp.dataset.cfMat,actual_gain:v});
      if(!res.ok) throw new Error(res.message||res.error);
      renderHistory();
    }catch(e){alertErr(e);}
  });
  document.querySelectorAll("[data-apply-mat]").forEach(btn=>btn.onclick=async()=>{
    const mat=btn.dataset.applyMat, val=+btn.dataset.applyVal;
    if(!(await qConfirm(`把「${matName(mat)}」的每轮产出改为 ${val}？`)))return;
    try{
      const per_run={...BOOT.tables.yields.per_run,[mat]:val};
      const res=await api("/api/tables/yields",{per_run});
      BOOT.tables.yields=res.yields;
      toast(`「${matName(mat)}」产量已改为 ${val}`);
      renderHistory();
    }catch(e){alertErr(e);}
  });
}

async function onCodexWikiFetch(){

    if(r2.wiki_summary)
      info.textContent=`wiki 四组成员数：${Object.entries(r2.wiki_summary.groups).map(([k,v])=>k+"="+v).join(" / ")}（${r2.wiki_summary.fetched_at}）`;
    if(!r2.ok){toast(r2.error||"拉取失败","err");return;}

    $("#cx_skill").value=p.skill_series||"";

/* ---------- 日志（ok-nte 任务/应用日志 + 面板日志） ---------- */
let LOGS_CURRENT = {files: [], idx: -1, lines: 300};
async function renderLogs(){
  const r = await api("/api/logs").catch(e=>({error:e.message}));
  if(r.error){ $("#main").innerHTML=`<div class="card"><div class="banner warn">${esc(r.error)}</div></div>`; return; }
  LOGS_CURRENT.files = r.logs||[];
  const rows = LOGS_CURRENT.files.map((f,i)=>`
    <tr><td><b>${esc(f.name)}</b></td><td class="muted num">${esc(f.mtime)}</td><td class="num">${(f.size/1024).toFixed(1)} KB</td>
    <td><button class="btn sec mini" data-log-view="${i}">查看尾部</button>
    <button class="btn sec mini" data-log-dl="${i}">⬇ 导出</button></td></tr>`).join("");
  $("#main").innerHTML=`
    <div class="card"><h3>日志文件<span class="h-sub">ok-nte 任务日志 / 应用日志 / 面板自身日志；查看末尾 300 行（可加载到 2000），或导出完整文件</span></h3>
    ${rows?`<table><tr><th>文件</th><th>修改时间</th><th>大小</th><th>操作</th></tr>${rows}</table>`
      :'<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>还没有可读的日志文件（首次执行 ok-nte 任务后产生）</div>'}</div>
    <div class="card" id="logViewCard" style="display:none"><h3 id="logViewName"></h3>
      <div id="logView" class="term" style="height:440px"></div>
      <div class="row" style="margin-top:8px"><button class="btn sec mini" id="btnLogMore">加载更多行</button>
      <button class="btn sec mini" id="btnLogDl">⬇ 导出完整文件</button>
      <span class="muted" id="logViewMeta"></span></div></div>`;
  document.querySelectorAll("[data-log-view]").forEach(b=>b.onclick=()=>viewLog(+b.dataset.logView, LOGS_CURRENT.lines));
  document.querySelectorAll("[data-log-dl]").forEach(b=>b.onclick=()=>downloadLog(+b.dataset.logDl));
  $("#btnLogMore").onclick=()=>viewLog(LOGS_CURRENT.idx, Math.min(2000, LOGS_CURRENT.lines+300));
  $("#btnLogDl").onclick=()=>downloadLog(LOGS_CURRENT.idx);
}
async function viewLog(idx, lines){
  try{
    const r=await api(`/api/logs/tail?i=${idx}&lines=${lines}`);
    LOGS_CURRENT.idx=idx; LOGS_CURRENT.lines=lines;
    $("#logViewCard").style.display="block";
    $("#logViewName").textContent=r.name;
    $("#logViewMeta").textContent=`显示末尾 ${r.lines.length} 行 / 共 ${r.total} 行`;
    const el=$("#logView");
    el.textContent=r.lines.join("\n")||"（空文件）";
    el.scrollTop=el.scrollHeight;
    $("#logViewCard").scrollIntoView({behavior:"smooth",block:"nearest"});
  }catch(e){alertErr(e);}
}
async function downloadLog(idx){
  const f=LOGS_CURRENT.files[idx]; if(!f)return;
  try{
    const res=await fetch(`/api/logs/download?i=${idx}`);
    if(!res.ok){ toast("日志导出失败","err"); return; }
    const text=await res.text();
    const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=f.name.replace("/","_")+".log";
    a.click(); URL.revokeObjectURL(a.href);
    toast("日志已导出");
  }catch(e){alertErr(e);}
}

/* ---------- 框架 ---------- */
const PAGE_TITLES={overview:["总览","当日计划 · 执行控制 · 推演"],chars:["角色","养成目标与直接材料需求"],
  arc:["弧盘","按名字选择 · 物态适配过滤 · 材料按目标计算"],
  nullmux:["空幕","卡带 × 驱动块 · 词条记录"],
  teams:["配队","4 人队伍 · 跨队可复用 · 队内唯一"],
  codex:["图鉴数据","手动录入新角色/武器 + wiki 拉取预填"],
  common:["通用材料","每角色通用数量 → 具体材料映射"],inv:["库存","全量材料持有量"],
  tables:["数据表","产量 · 需求表 · 材料名校准"],settings:["设置","执行策略 · 体力模型 · 导入导出"],
  history:["历史","执行记录与产量校准闭环"],logs:["日志","ok-nte 任务/应用日志 · 面板日志"]};
async function boot(){
  BOOT=await api("/api/bootstrap");
  window.__A2S__ = BOOT.attr_map||{};  // 属性→书系映射（技能书适配过滤用）
  const tags=[];
  const c = BOOT.compat;
  if (c.status === "incompatible")
    tags.push(`<span class="tag err" title="${esc((c.problems||[]).join('；'))}">ok-nte 不兼容</span>`);
  else if (c.status === "compatible_with_warning")
    tags.push(`<span class="tag warn" title="${esc((c.warnings||[]).join('；'))}">ok-nte ${esc(c.version||"?")} 兼容(警告)</span>`);
  else
    tags.push(`<span class="tag ok">ok-nte ${esc(c.version||"?")}</span>`);
  tags.push(BOOT.admin?`<span class="tag ok">管理员</span>`:`<span class="tag warn">非管理员</span>`);
  tags.push(BOOT.oknte_running?`<span class="tag warn">ok-nte 运行中</span>`:`<span class="tag ok">ok-nte 已关闭</span>`);
  tags.push(`<span class="tag" title="构建标识：若与你刚安装的版本不符，说明浏览器开的是旧面板页面（关掉重开即可）">构建 ${esc((BOOT.build||{}).built_at||"dev")}</span>`);
  $("#envTags").innerHTML=tags.join("");
}
let CURRENT="overview";
function switchPage(t){
  CURRENT=t;
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x.dataset.t===t));
  const title=PAGE_TITLES[t]||[t,""];
  $("#pageTitle").textContent=title[0];
  $("#pageSub").textContent=title[1];
  clearInterval(TIMER);
  if(!BOOT) return;  // bootstrap 未完成（兼容检测约需数秒）：先记下目标页，boot 完成后按 CURRENT 渲染
  ({overview:renderOverview,chars:renderChars,arc:renderArc,nullmux:renderNullmux,teams:renderTeams,
    codex:renderCodex,common:renderCommon,inv:renderInv,
    tables:renderTables,settings:renderSettings,history:renderHistory,logs:renderLogs})[t]();
  if(t==="overview") TIMER=setInterval(refreshStatus,2000);
}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>switchPage(b.dataset.t));
boot().then(()=>switchPage(CURRENT)).catch(e=>{
  $("#main").innerHTML=`<div class="card"><div class="banner warn">加载失败：${esc(e.message)}</div></div>`;
});
</script>
