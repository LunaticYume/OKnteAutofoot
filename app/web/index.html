<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>异环养成规划器 · OKnteAutofoot</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0b0f14; --panel:#131a22; --panel2:#1a232e; --panel3:#212d3b;
    --line:#223041; --line2:#2d3d51;
    --txt:#e6eef7; --dim:#8fa2b7; --faint:#5f7186;
    --acc:#53b6ff; --acc-deep:#1f6fbd; --acc-soft:rgba(83,182,255,.12);
    --acc-bd:rgba(83,182,255,.45); --acc-bd-soft:rgba(83,182,255,.35); --acc-ghost:rgba(83,182,255,.04);
    --ok:#3ecf8e; --warn:#f5b544; --err:#ff6b6b;
    --r:14px; --shadow:0 8px 28px rgba(0,0,0,.35);
  }
  /* 明亮主题覆盖块（四页调整④）：html[data-theme=light] 时整体换亮色变量，由
     topbar 按钮 + localStorage('theme') 切换/持久化（缺省=暗色即上面的默认集）。
     主题敏感的强调蓝已全部 var 化（--acc-bd/--acc-bd-soft/--acc-ghost）：暗色
     取值与原硬编码逐字一致（唯 hero 渐变尾 .06→.04、pv-day 边 .50→.45 两处并入
     既有变量，≤.05 alpha 差异不可感知），亮色给深一档蓝保证对比度；ok/warn/err
     同步加深一档（亮底上原色偏浅难以辨认），暗色不受影响。有意保留的硬编码：
     .chip.acc 的 .4 边/.07 底（chip 家族淡色底边一体口径，chip.ok/.warn/.err 同
     为硬编码）、OCR 标定预览格内联 rgba（叠加在游戏截图上，与主题无关）、
     历史图表 SVG 填色 #53b6ff/#3ecf8e（亮底可辨）。 */
  [data-theme="light"]{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#f1f5fa; --panel3:#e5ecf4;
    --line:#d4deea; --line2:#c1cfdd;
    --txt:#1b2735; --dim:#4e6178; --faint:#76879c;
    --acc:#1e78d0; --acc-deep:#155a9e; --acc-soft:rgba(30,120,208,.12);
    --acc-bd:rgba(30,120,208,.45); --acc-bd-soft:rgba(30,120,208,.35); --acc-ghost:rgba(30,120,208,.06);
    --ok:#1d9e6b; --warn:#b07a15; --err:#d64545;
    --shadow:0 8px 28px rgba(40,70,110,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--txt);font:14px/1.65 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  b,strong{font-weight:600}
  ::selection{background:var(--acc-deep);color:#fff}

  /* ===== 布局骨架 ===== */
  .app{display:flex;min-height:100vh}
  .side{width:232px;flex-shrink:0;display:flex;flex-direction:column;background:var(--panel);
    border-right:1px solid var(--line);position:sticky;top:0;height:100vh;z-index:5}
  .logo{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
  .logo b{font-size:16px;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
  .logo b::before{content:"";width:26px;height:26px;border-radius:8px;flex-shrink:0;
    background:linear-gradient(135deg,var(--acc),var(--acc2,#7c5cff));
    box-shadow:0 0 14px var(--acc-bd)}
  .logo span{display:block;font-size:11px;color:var(--faint);margin-top:3px;padding-left:35px}
  nav#nav{display:flex;flex-direction:column;gap:2px;padding:12px 10px;flex:1;overflow-y:auto}
  nav#nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:none;border:1px solid transparent;color:var(--dim);padding:9px 12px;
    border-radius:10px;cursor:pointer;font-size:14px;transition:background .15s,color .15s}
  nav#nav button svg{width:17px;height:17px;flex-shrink:0}
  nav#nav button:hover{color:var(--txt);background:var(--panel2)}
  nav#nav button.on{color:var(--txt);background:var(--acc-soft);border-color:var(--acc-bd-soft)}
  nav#nav button.on svg{color:var(--acc)}
  .side-foot{padding:12px 14px;border-top:1px solid var(--line);font-size:12px}
  .side-foot .tag{display:flex;justify-content:center;margin-bottom:6px}
  .side-foot .tag:last-child{margin-bottom:0}
  .content{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:baseline;gap:12px;padding:16px 24px 0;max-width:1200px;width:100%;margin:0 auto}
  /* 保存栏：置于各页内容首行并吸附在可视区顶部（滚动容器=根视口） */
  .save-bar{position:sticky;top:0;z-index:6;background:var(--bg);padding:10px 0 8px;
    border-bottom:1px solid var(--line);margin-bottom:10px}
  .topbar h1{font-size:20px;margin:0;font-weight:650}
  .topbar .sub{color:var(--faint);font-size:12px}
  main{padding:14px 24px 40px;max-width:1200px;width:100%;margin:0 auto}
  @media (max-width:920px){
    .side{width:60px}
    .logo b{font-size:0;gap:0;justify-content:center}.logo b::before{margin:0}
    .logo span{display:none}
    nav#nav button{justify-content:center;padding:10px 0}
    nav#nav button svg{width:19px;height:19px}
    .side-foot{display:none}
  }

  /* ===== 卡片与通用 ===== */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 12px;font-size:14px;color:var(--txt);display:flex;align-items:center;gap:8px}
  .card h3::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--acc);flex-shrink:0}
  .card h3 .h-sub{font-size:12px;color:var(--faint);font-weight:normal}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:8px}
  .muted{color:var(--dim);font-size:12px}
  .num{font-variant-numeric:tabular-nums}
  .grow{flex:1}
  label{font-size:13px;color:var(--dim)}

  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:6px 10px;font-size:13px;outline:none;transition:border .15s,box-shadow .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
  input[type=number]{width:90px}
  textarea{width:100%;min-height:300px;font-family:Consolas,monospace;font-size:12px}
  input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px;cursor:pointer}

  .btn{background:linear-gradient(180deg,#5fbfff,#3d9df0);border:none;color:#04121f;
    padding:8px 18px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:600;
    transition:filter .15s,transform .05s;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{filter:brightness(1.1)}
  .btn:active{transform:translateY(1px)}
  .btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line2);font-weight:normal}
  .btn.sec:hover{border-color:var(--acc);filter:none;background:var(--panel3)}
  .btn.danger{background:linear-gradient(180deg,#ff7d7d,#e85555);color:#210707}
  .btn.mini{padding:3px 10px;font-size:12px;border-radius:7px}
  .btn.big{padding:11px 26px;font-size:15px;border-radius:11px}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:none}

  .pill{display:inline-flex;align-items:center;gap:6px;padding:2px 11px;border-radius:999px;
    font-size:12px;font-weight:600;border:1px solid var(--line2);color:var(--dim);background:var(--panel2)}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .pill.run{color:var(--ok);border-color:rgba(62,207,142,.5);background:rgba(62,207,142,.08)}
  .pill.run::before{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .pill.wait{color:var(--warn);border-color:rgba(245,181,68,.5);background:rgba(245,181,68,.08)}
  .pill.wait::before{background:var(--warn)}
  .pill.err{color:var(--err);border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.08)}
  .pill.err::before{background:var(--err)}
  .pill.off{color:var(--err)}
  .pill.off::before{background:var(--err)}
  .pill.on{color:var(--ok)}
  .pill.on::before{background:var(--ok)}

  .tag{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;
    font-size:11.5px;border:1px solid var(--line2);color:var(--dim);background:var(--panel2)}
  .tag.ok{color:var(--ok);border-color:rgba(62,207,142,.45)}
  .tag.err{color:var(--err);border-color:rgba(255,107,107,.45)}
  .tag.warn{color:var(--warn);border-color:rgba(245,181,68,.45)}
  .tag.acc{color:var(--acc);border-color:var(--acc-bd)}

  .chip{display:inline-flex;align-items:center;padding:1px 9px;border-radius:7px;font-size:12px;
    background:var(--panel3);color:var(--txt);border:1px solid var(--line2);font-variant-numeric:tabular-nums}
  .chip.ok{color:var(--ok);border-color:rgba(62,207,142,.4);background:rgba(62,207,142,.07)}
  .chip.acc{color:var(--acc);border-color:rgba(83,182,255,.4);background:rgba(83,182,255,.07)}
  .chip.warn{color:var(--warn);border-color:rgba(245,181,68,.4);background:rgba(245,181,68,.07)}
  .ocr-off{opacity:.45}  /* OCR 命中预览行取消勾选：弱化显示（应用/保存时跳过该行） */
  /* OCR 命中行数量框：聚焦强化高亮（宽框+黄边，明示「这是可编辑输入」——用户曾把
     90px 小框夹在大 chip 后当成静态徽标，实测「没有办法改成3」） */
  #ocrHitGrid input[data-ocr]:focus{border-color:var(--warn);box-shadow:0 0 0 3px rgba(245,181,68,.28);background:var(--panel3)}
  /* 判 0 标记：「以本次识别为准」清 0 的库存输入框加醒目红框，提交前肉眼复核 */
  input.inv-zeroed{border-color:var(--err)!important;box-shadow:0 0 0 2px rgba(255,107,107,.30)!important}

  /* ===== 抽卡分析改版（2026-11-08）：池 Tab / 筛选 chip / 保底区间条 / 出S直方图 / S明细横条图
     2026-11-12 AK 排版（参考 arkgacha.kwer.top 字号体系）：撤 0.75 zoom，文字直接
     回到舒适区；汇总改 metric 大数字卡 + 新增三池汇总卡行；保底条胶囊化 ===== */
  .gtab{cursor:pointer;border:1px solid var(--line2);background:var(--panel2);color:var(--dim);
    padding:5px 18px;border-radius:999px;font-size:14px;transition:border .15s,color .15s}
  .gtab:hover{color:var(--txt);border-color:var(--acc)}
  .gtab.on{color:var(--acc);border-color:var(--acc-bd);background:var(--acc-soft)}
  .gstate{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--faint);
    border:1px dashed var(--line2);border-radius:9px;padding:5px 12px;margin-top:10px}
  /* 汇总 metric 卡：label 小字 muted + 大数字 + 小注（撤 zoom 后的替代排版） */
  .gmetrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
  @media (max-width:640px){.gmetrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .gmetric{display:flex;flex-direction:column;gap:2px;min-width:0;border:1px solid var(--line2);
    border-radius:12px;background:var(--panel2);padding:10px 14px}
  .gmetric-label{font-size:12.5px;color:var(--dim)}
  .gmetric-val{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-0.02em;
    line-height:1.2;color:var(--txt);font-variant-numeric:tabular-nums}
  .gmetric-note{font-size:12px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 三池汇总卡行：每池一卡横排（窄屏换行单列），卡=池名 + 大数字抽数 + 出S/平均小注 */
  .gpool-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  @media (max-width:640px){.gpool-cards{grid-template-columns:1fr}}
  .gpool-card{display:flex;flex-direction:column;gap:2px;min-width:0;border:1px solid var(--line2);
    border-radius:12px;background:var(--panel2);padding:10px 14px}
  .gpool-card .gpool-name{font-size:13px;color:var(--dim)}
  .gpool-card .gpool-num{display:flex;align-items:baseline;gap:4px}
  .gpool-card .gpool-num b{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-0.02em;
    line-height:1.2;font-variant-numeric:tabular-nums}
  .gpool-card .gpool-unit{font-size:12px;color:var(--faint)}
  .gpool-card .gpool-note{font-size:12px;color:var(--faint);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  /* 保底进度行：胶囊条 14px→8px 全圆角；「精确/估算」tag 在此行放大到 12px
     （.tag 基类 11.5px 全局共用，不全局改，只作用域本行） */
  .gp-line .tag{font-size:12px}
  .gpity{position:relative;height:8px;border-radius:999px;background:var(--panel2);
    border:1px solid var(--line2);overflow:hidden;margin-top:8px}
  .gpity .gp-fill{position:absolute;left:0;top:0;bottom:0;background:var(--acc);opacity:.85}
  .gpity .gp-zone{position:absolute;top:0;bottom:0;  /* 垫抽数下界→保底线：不确定区（斜纹） */
    background:repeating-linear-gradient(45deg,rgba(245,181,68,.45) 0 6px,transparent 6px 12px)}
  .ghisto{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:10px}
  .ghisto .gp-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
    align-items:center;gap:2px;min-width:0}
  .ghisto .gp-bar{width:72%;max-width:42px;border-radius:3px 3px 0 0;
    display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
  .ghisto .gp-cap{font-size:12px;color:var(--faint);white-space:nowrap}
  /* S 明细横躺条形图（2026-11-08 迭代：按月分组 chip 时间线退役）：每发 S 一行，
     画法复用 .gpity 的「容器 + absolute 填充 + inline 百分比宽度」 */
  .gbar-row{margin-top:10px}
  .gbar-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    padding-left:108px;  /* 名字行左缘与下方条形对齐（100px 头像 + 8px gap，四页调整③） */
    font-size:13px;color:var(--faint);margin-bottom:3px}
  .gbar-top b{font-size:14px;color:var(--txt)}
  /* 角色头像（2026-11-09 工作包2）：/avatars/ 本地缓存图 + 首字母占位回落 */
  .avatar-img{width:26px;height:26px;border-radius:7px;object-fit:cover;display:block;
    border:1px solid var(--line2);background:var(--panel2)}
  .avatar-img.sm{width:22px;height:22px;border-radius:6px}
  .avatar-ph{width:26px;height:26px;border-radius:7px;display:inline-flex;flex-shrink:0;
    align-items:center;justify-content:center;font-size:13px;font-weight:600;
    color:var(--acc);background:var(--acc-soft);border:1px solid var(--acc-bd-soft)}
  .avatar-ph.sm{width:22px;height:22px;border-radius:6px;font-size:11px}
  /* 大头像作用域：角色卡详情大头像在 .body 内右浮动环绕（见下方 .char .body
     .avatar-box）；空幕卡维持恒显全卡高竖列（stretch）贴右缘。头像统一 9:16 竖版
     （height:auto 让 aspect-ratio 接管高度；object-position:top 裁切时保住头部）。 */
  .char.char-av{display:flex;align-items:flex-start}
  .char-main,.nm-body{flex:1;min-width:0}
  .nm-card{display:flex;align-items:stretch}
  /* 角色卡详情大头像：.body 首元素右浮动环绕（2026-11-11 调整——下方内容绕排，
     不再把后续行整段下推）；120px 9:16，展开态由 .body 可见性天然保持 */
  .char .body .avatar-box{float:right;margin:0 0 8px 10px;display:flex;
    flex-direction:column;align-items:center;gap:5px}
  .char .body .avatar-box .avatar-img,.char .body .avatar-box .avatar-ph{
    width:120px;aspect-ratio:9/16;height:auto;object-fit:cover;object-position:top;
    border-radius:14px;font-size:40px}
  .nm-card>.avatar-box{flex:0 0 120px;width:120px;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;gap:5px;padding:10px 0;
    border-left:1px solid var(--line)}
  .nm-card>.avatar-box .avatar-img,.nm-card>.avatar-box .avatar-ph{
    width:120px;aspect-ratio:9/16;height:auto;object-fit:cover;object-position:top;
    border-radius:14px;font-size:40px}
  .avatar-name{max-width:96px;font-size:11px;color:var(--faint);line-height:1.2;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 抽卡 S 明细行（2026-11-10 第二轮调优）：两行结构——上行=角色名/时间/卡池名；
     下行=100px 9:16 竖版头像 + track 垂直居中（行高随头像自然撑开） */
  .gbar-body{display:flex;align-items:center;gap:8px}
  .gbar-av{flex:0 0 100px}
  .gbar-av .avatar-img,.gbar-av .avatar-ph{width:100px;aspect-ratio:9/16;height:auto;
    object-fit:cover;object-position:top;border-radius:12px;font-size:22px}
  /* 配队卡成员头像行（2026-11-10 第二轮调优）：4 等分 grid 与成员下拉行同宽，
     每格 9:16 竖版头像居中于对应下拉列正上方；空位灰虚线占位同形状 */
  .team-avrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;
    justify-items:center;margin:8px 0}
  .team-avrow>span{display:inline-flex}
  /* 头像与下方下拉按钮等宽（格宽=4 等分，随页面宽度缩放；2026-11-11 调整） */
  .team-avrow>span{width:100%;cursor:pointer}
  .team-avrow .avatar-img,.team-avrow .avatar-ph{width:100%;aspect-ratio:9/16;height:auto;
    object-fit:cover;object-position:top;border-radius:14px;font-size:30px}
  .team-avrow .avatar-ph.av-empty{background:var(--panel2);border-style:dashed;
    border-color:var(--line2);color:var(--faint)}
  .team-memrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0}
  .team-memrow .t-member{width:100%}
  .gbar-track{position:relative;flex:1;height:27px;border-radius:13px;background:var(--panel2);  /* 条形加粗 18→27 / r9→13（四页调整②） */
    border:1px solid var(--line2);overflow:hidden}
  /* 条形填充改 90deg 渐变（2026-11-12 AK 排版）：rgba(色,.45)→实色，阈值三色语义
     不变（≤30 ok / 贴 m err / 中段 warn）。淡色端 rgba 硬编码沿用 chip 家族同款
     口径（chip.ok/.warn/.err 亦硬编码；亮色主题下淡端略亮可接受） */
  .gbar-fill{position:absolute;left:0;top:0;bottom:0;opacity:.85;
    background:linear-gradient(90deg,rgba(83,182,255,.45),var(--acc))}
  .gbar-fill.ok{background:linear-gradient(90deg,rgba(62,207,142,.45),var(--ok))}
  .gbar-fill.warn{background:linear-gradient(90deg,rgba(245,181,68,.45),var(--warn))}
  .gbar-fill.err{background:linear-gradient(90deg,rgba(255,107,107,.45),var(--err))}
  .gbar-val{position:absolute;right:6px;top:50%;transform:translateY(-50%);  /* 条内右侧标 pity 数 */
    font-size:12px;color:var(--txt);font-variant-numeric:tabular-nums;  /* 11→12：条加粗后保持可读（四页调整②） */
    text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none}
  .chip.err{color:var(--err);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.07)}

  /* ===== 材料副本（2026-11-08 迭代；2026-11-09 工作包4 改 grid 固定列） =====
     原 flex+gap16+wrap 窄屏换行时 需/持/差 三格错位；改 grid 后所有行按列对齐：
     名称自适应（minmax(0,1fr) 可收缩）+ 需/持/差 64px 定宽 + 轮次 pill 右固定 */
  .dmat{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,64px) auto;
    align-items:center;gap:6px 16px;padding:8px 0}
  .dmat>.chip{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dmat+.dmat{border-top:1px dashed var(--line)}  /* 材料行间细分隔；合计行自带 border-top 对齐 */
  .dstat{display:flex;flex-direction:column;gap:1px;min-width:52px}
  .dstat .ds-label{font-size:11px;color:var(--faint);line-height:1.35}
  .dstat .ds-val{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.35}
  .dstat-gap .ds-val{font-size:16.5px;color:var(--err)}  /* 差值：缺口>0 着色大字强调（err） */
  .dstat-gap.gap-zero .ds-val{font-size:13.5px;font-weight:normal;color:var(--faint)}  /* 已齐：弱化 */

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{color:var(--faint);font-weight:normal;font-size:12px;white-space:nowrap}
  tbody tr:hover{background:var(--acc-ghost)}

  .banner{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;border-radius:10px;
    font-size:12.5px;margin:8px 0;border:1px solid}
  .banner.warn{color:var(--warn);border-color:rgba(245,181,68,.35);background:rgba(245,181,68,.06)}
  .banner.info{color:var(--dim);border-color:var(--line2);background:var(--panel2)}

  .empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 10px;
    color:var(--faint);font-size:13px;border:1px dashed var(--line2);border-radius:var(--r)}
  .empty svg{width:30px;height:30px;opacity:.5}

  /* ===== 总览 ===== */
  .hero{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;
    background:linear-gradient(120deg,var(--panel) 55%,var(--acc-ghost))}
  .run-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .run-line b{font-size:16px}
  .hero .desc{color:var(--faint);font-size:12px;margin-top:6px;max-width:560px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-bottom:14px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
  .tile .t-main b{display:block;font-size:21px;font-variant-numeric:tabular-nums;line-height:1.25}
  .tile .t-main span{font-size:12px;color:var(--dim)}
  .ring{width:74px;height:74px;flex-shrink:0}
  .ring-bg{fill:none;stroke:var(--panel3);stroke-width:7}
  .ring-fg{fill:none;stroke:var(--acc);stroke-width:7;stroke-linecap:round;
    transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .6s}
  .ring-fg.hot{stroke:var(--warn)}
  .ring-fg.full{stroke:var(--err)}
  .ring-txt{fill:var(--txt);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}

  .steps{display:flex;flex-direction:column}
  .step{display:flex;gap:12px;padding:10px 2px;border-bottom:1px dashed var(--line)}
  .step:last-child{border-bottom:none}
  .step-n{width:24px;height:24px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;background:var(--acc-soft);color:var(--acc);font-size:12.5px;font-weight:700;
    border:1px solid var(--acc-bd-soft);margin-top:2px}  /* .35 与变量逐字同值，归一（复审 #11 遗留） */
  .step-main{flex:1;min-width:0}
  .step-reason{color:var(--dim);font-size:12px;margin-top:3px}

  .pend-item{border:1px solid rgba(245,181,68,.35);background:rgba(245,181,68,.05);
    border-radius:12px;padding:10px 14px;margin-bottom:8px}
  .pend-item:last-child{margin-bottom:0}

  .term{background:#080c11;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    height:250px;overflow-y:auto;font:12px/1.75 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap}
  .term .ln{color:#a9bcd0}
  .term .ln.ok{color:var(--ok)}
  .term .ln.warn{color:var(--warn)}
  .term .ln.err{color:var(--err)}
  .term::-webkit-scrollbar{width:8px}
  .term::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}

  .pv-days{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
  .pv-day{border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:var(--panel2)}
  .pv-day.today{border-color:var(--acc-bd);background:var(--acc-soft)}
  .pv-day .pv-date{font-weight:600;font-size:13px}
  .pv-day .pv-budget{font-size:12px;color:var(--acc);margin:2px 0 6px;font-variant-numeric:tabular-nums}
  .pv-day .pv-steps{font-size:12px;color:var(--dim);min-height:34px}
  .pv-day .pv-foot{font-size:11.5px;color:var(--faint);margin-top:6px;font-variant-numeric:tabular-nums}

  /* ===== 角色卡 ===== */
  .char{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;
    background:var(--panel);transition:border-color .15s}
  .char:hover{border-color:var(--line2)}
  .char .head{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--panel2);flex-wrap:wrap;cursor:pointer}
  .char .body{padding:12px 14px;display:none;border-top:1px solid var(--line)}
  .char .body::after{content:"";display:block;clear:both}  /* 浮动头像 clearfix：末行内容不与头像重叠 */
  .char.open .body{display:block}
  .need-row{display:grid;grid-template-columns:2fr 70px 70px 70px 60px;gap:6px;align-items:center}
  .lib-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 6px 3px 11px;border-radius:999px;
    background:var(--panel3);border:1px solid var(--line2);font-size:12.5px}
  .lib-chip button{border:none;background:none;color:var(--err);cursor:pointer;font-size:14px;
    padding:0 5px;border-radius:50%;line-height:1}
  .lib-chip button:hover{background:rgba(255,107,107,.15)}

  /* ===== 开关 ===== */
  .switch{position:relative;display:inline-flex;align-items:center;cursor:pointer;flex-shrink:0}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch .sl{width:38px;height:21px;border-radius:999px;background:var(--panel3);
    border:1px solid var(--line2);position:relative;transition:background .15s}
  .switch .sl::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;
    border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
  .switch input:checked+.sl{background:var(--acc-deep);border-color:var(--acc-deep)}
  .switch input:checked+.sl::after{transform:translateX(17px);background:#fff}
  .set-row{display:flex;align-items:center;gap:12px;margin-bottom:11px;flex-wrap:wrap}
  .set-row>label:first-child{width:170px;flex-shrink:0;text-align:right}
  .set-row .note{font-size:12px;color:var(--faint);flex:1;min-width:200px}
  @media (max-width:700px){.set-row>label:first-child{width:100%;text-align:left}}

  .kv{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
  .mat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:8px}
  .mat-item{display:flex;gap:8px;align-items:center;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:7px 10px}
  .mat-item label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ===== Toast 与对话框 ===== */
  #toasts{position:fixed;right:18px;top:18px;z-index:99;display:flex;flex-direction:column;gap:8px}
  .toast{background:var(--panel3);border:1px solid var(--line2);border-left:3px solid var(--acc);
    color:var(--txt);padding:10px 16px;border-radius:10px;font-size:13px;max-width:380px;
    box-shadow:var(--shadow);animation:tin .25s ease}
  .toast.ok{border-left-color:var(--ok)}
  .toast.err{border-left-color:var(--err)}
  .toast.out{opacity:0;transform:translateX(12px);transition:all .3s}
  @keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
  .modal-ov{position:fixed;inset:0;background:rgba(4,8,12,.62);z-index:98;display:flex;
    align-items:center;justify-content:center;backdrop-filter:blur(2px)}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;
    padding:20px 22px;max-width:440px;width:calc(100% - 40px);box-shadow:var(--shadow)}
  .modal-msg{font-size:13.5px;line-height:1.7;white-space:pre-wrap}

  /* ===== ok-nte 规划编辑器（2026-11-12）：分组卡 + 开关/键值行 + 循环序列多选网格 ===== */
  .plan-modal{max-width:760px;max-height:86vh;overflow-y:auto}
  .plan-group{border:1px solid var(--line2);border-radius:12px;background:var(--panel2);
    padding:12px 14px;margin-top:10px}
  .plan-group-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .plan-group-h b{font-size:13.5px}
  .plan-src{font-size:12px;color:var(--faint)}  /* 组标题旁小字 */
  .plan-group-b{font-size:13px}
  .plan-checks{display:flex;gap:6px;flex-wrap:wrap}
  .plan-check{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--txt);
    cursor:pointer;padding:4px 10px;border:1px solid var(--line);border-radius:9px;
    background:var(--panel);user-select:none}
  .plan-check:hover{border-color:var(--acc)}
  .plan-check input{margin:0;flex-shrink:0}
  .plan-num-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:4px}
  .plan-kv{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
  .plan-kv input{width:130px}
  .plan-range{font-size:11px;color:var(--faint)}
  .plan-sec{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
  .plan-sec:first-child{border-top:none;padding-top:0;margin-top:0}
  .plan-sec-name{display:inline-block;font-size:12.5px;color:var(--dim);margin-bottom:4px}
  .plan-seq-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
  @media (max-width:700px){.plan-seq-grid{grid-template-columns:1fr 1fr}}
</style>

<script>
"use strict";
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let BOOT=null, TIMER=null;
/* 面板令牌（SEC-05）：后端 GET / 每请求把占位符替换为本次启动生成的令牌，
   所有 /api 请求经 AUTH_HEADERS 附 X-Panel-Token 头（api() 与 15 处裸 fetch）。 */
const PANEL_TOKEN="__PANEL_TOKEN__";
const AUTH_HEADERS={"X-Panel-Token":PANEL_TOKEN};

/* ---------- 角色头像（2026-11-09 工作包2；2026-11-10 源站改 wiki.mysqil.com） ----------
   数据源=bootstrap 的 BOOT.avatars（实名→/avatars/<slug>.webp，后端只发本机已
   下载文件；wiki.mysqil.com 头像（mysqil 拼音 slug）随「同步攻略站」落本机）。
   三处使用：抽卡 S 明细行头 / 角色卡头 / 空幕卡标题。未映射或加载失败一律回落
   首字母占位（绝不破图）。 */
function avatarUrl(name){
  /* 实名→头像 URL：精确 → 去尾部（…）基名（零（男）→零，后端已做同规则，此处
     只是兜底）→ 去前缀段取「·」后实名（塔吉多面板实名可能带「异能者·」类前缀，
     同 _tajiduo_match_name 口径）。映射不到返回 null（调用方渲染首字母占位）。 */
  const map=BOOT&&BOOT.avatars||{};
  const n=String(name||"").trim();
  if(!n) return null;
  if(map[n]) return map[n];
  const base=n.replace(/（[^）]*）$/,"").trim();
  if(base && map[base]) return map[base];
  const tail=n.split("·").pop().trim();
  if(tail && tail!==n){ if(map[tail]) return map[tail];
    const tb=tail.replace(/（[^）]*）$/,"").trim();
    if(tb && map[tb]) return map[tb]; }
  return null;
}
function avatarImg(name, small){
  const url=avatarUrl(name), cls=small?" sm":"";
  if(!url)
    return `<span class="avatar-ph${cls}">${esc(String(name||"?").trim().charAt(0)||"?")}</span>`;
  return `<img class="avatar-img${cls}" src="${esc(url)}" alt="" loading="lazy"
    data-avname="${esc(String(name||"?"))}" onerror="avatarFallback(this)">`;
}
window.avatarFallback=function(img){
  /* <img onerror> 全局回落：按 data-avname 首字母生成占位块（textContent 赋值，
     实名不进 HTML 上下文） */
  const ph=document.createElement("span");
  ph.className="avatar-ph"+(String(img.className).includes(" sm")?" sm":"");
  ph.textContent=String(img.dataset.avname||"?").trim().charAt(0)||"?";
  img.replaceWith(ph);
};

/* ---------- Toast 与对话框（替代 alert/confirm） ---------- */
function toast(msg, kind="ok"){
  const host=document.getElementById("toasts");
  const t=document.createElement("div");
  t.className="toast "+kind; t.textContent=msg;
  host.appendChild(t);
  setTimeout(()=>{t.classList.add("out");setTimeout(()=>t.remove(),320);},3400);
}
function alertErr(e){toast("操作失败："+e.message,"err");}
function qConfirm(msg){
  return new Promise(res=>{
    const ov=document.createElement("div"); ov.className="modal-ov";
    ov.innerHTML=`<div class="modal"><div class="modal-msg"></div>
      <div class="row" style="justify-content:flex-end;margin:16px 0 0">
      <button class="btn sec" data-q="0">取消</button><button class="btn" data-q="1">确定</button></div></div>`;
    ov.querySelector(".modal-msg").textContent=msg;
    const done=v=>{ov.remove();res(v);};
    ov.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>done(b.dataset.q==="1"));
    ov.onclick=e=>{if(e.target===ov)done(false);};
    document.body.appendChild(ov);
  });
}

async function api(path, body, timeoutMs=15000){
  const opt = body===undefined ? {headers:AUTH_HEADERS} : {method:"POST",headers:{...AUTH_HEADERS,"Content-Type":"application/json"},body:JSON.stringify(body)};
  // 本地面板不该有请求挂死：默认 15 秒超时兜底，失败走「加载失败」横幅而不是无限空白。
  // 慢端点按后端最坏耗时传入更大的 timeoutMs（如 /api/ocr/capture 截屏链路最坏 ≈120s：
  // _bind_game_window→窗口枚举 PS timeout=30s + 截图 _ocr_run_ps 默认 timeout=90s），
  // 否则慢机器上客户端先超时报错、后端截图却实际成功，用户按报错重试反复失败
  const res = await fetch(path, {...opt, signal: AbortSignal.timeout(timeoutMs)});
  const data = await res.json().catch(()=>({}));
  if(!res.ok){
    // 面板令牌 401（panel_auth 专字段，SEC-05）：面板重启后旧页面令牌失效——
    // 必须先于 404 兜底与通用 throw，且绝不落入塔吉多「登录已过期」重绑引导
    if(res.status===401 && data.panel_auth) throw new Error(data.error||"面板鉴权失败：请刷新页面");
    // 404 且为裸 "not found"/带 hint = 旧后端进程缺新路由（诊断根因①：路由表随
    // 进程启动固化、本页每请求从磁盘重读）：给重启提示而非裸 "not found"。
    // 业务 404（如 /api/ocr/select「窗口不存在」）带具体 error 文案，原样保留
    const nf=notFoundHint(res,data);
    if(nf) throw new Error(nf);
    throw new Error(data.error||res.status);
  }
  // 服务端在写端点响应里回传数据版本 rev：本页基线随时跟进，避免自己写完后
  // 下次保存被 base_rev 乐观锁误拦（诊断 item6：跨标签页陈旧回写防线）
  if(BOOT && typeof data.rev==="number") BOOT.rev=data.rev;
  return data;
}

/* 404 自检（诊断根因①）：裸 "not found"（旧进程）或后端显式 hint = 面板后端
   进程为旧版本（新前端 + 旧后端错位窗口）。区别于「未绑定」等业务态——
   统一给可行动的重启提示，不误导用户去重新绑定。返回 null 表示不是该症状。 */
const NOTFOUND_HINT="面板后端进程为旧版本（缺少新接口），请完全退出面板进程（含托盘/后台 python）后重新启动/更新面板";
function notFoundHint(res,data){
  if(res && res.status===404 && ((data&&data.hint)||(data&&data.error==="not found")))
    return (data&&data.hint)||NOTFOUND_HINT;
  return null;
}

/* ---------- 数据工具 ---------- */
function allMaterials(){
  const M=BOOT.tables.materials;
  const list=(M.targets||[]).map(t=>({id:t.id,
    display:(t.concrete_names&&t.concrete_names.purple)||t.display_name||t.name,category:t.category,
    source:t.source||"",obtain:"stamina",name:t.name}));
  (M.extra_materials||[]).forEach(m=>list.push({id:m.id,display:m.display_name||m.id,
    category:m.category,source:m.source||"",obtain:m.obtain||"external"}));
  return list;
}
function matAllName(id){const m=allMaterials().find(x=>x.id===id);return m?m.display:id;}
function matName(id){return matAllName(id);}
/* 材料全量下拉选项（targets + extra_materials）：与库存页 data-inv 输入一一对应；
   OCR 未识别材料映射专用——generic 键（exp_char 等）没有库存输入框，映射了也应用不了，不列入 */
function matAllOptions(sel){
  return allMaterials().map(m=>
    `<option value="${esc(m.id)}" ${m.id===sel?"selected":""}>${esc(m.display)}</option>`).join("");
}
function obtainTag(o){
  return o==="stamina"?`<span class="tag acc">体力本</span>`
    :o==="hunter"?`<span class="tag warn">追猎</span>`:`<span class="tag">外部</span>`;
}
function ringSvg(pct){
  const r=33, c=2*Math.PI*r, p=Math.min(1,Math.max(0,pct));
  const cls = p>=1?"ring-fg full":p>=.8?"ring-fg hot":"ring-fg";
  return `<svg class="ring" viewBox="0 0 84 84">
    <circle cx="42" cy="42" r="${r}" class="ring-bg"/>
    <circle cx="42" cy="42" r="${r}" class="${cls}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p)).toFixed(1)}"/>
    <text x="42" y="47" text-anchor="middle" class="ring-txt">${Math.round(p*100)}%</text></svg>`;
}

        const go=await qConfirm("未勾选任何副本：将写入空循环序列（=停用循环），确定？");
        if(!go) return;
      }
      const tree=await api("/api/oknte/plan");
      const ov=tree.overrides||{};
      const body={};
      if(ov.routine_items) body.routine_items=ov.routine_items;
      body.daily_anomaly={...(ov.daily_anomaly||{}), "循环序列":entries};
      if(ov.hunter) body.hunter=ov.hunter;
      if(ov.misc) body.misc=ov.misc;
      if(ov.plan_targets) body.plan_targets=ov.plan_targets;
      await api("/api/oknte/plan", body, 30000);
      toast("已写入计划，下次执行生效");
    }catch(e){ alertErr(e); }
    finally{ btn.disabled=false; }
  };
  // ok-nte 选项折叠组：懒加载（首次展开拉取 /api/oknte/plan 选项树；旧版后端缺
  // 该路由时 404 走 notFoundHint 版本自检口径——api() 已转成「面板后端进程为旧
  // 版本…请重启」提示，展示在折叠组加载失败横幅处；502 带 ok-nte 配置路径原文）
  const optsBox=$("#planOptsBox"), optsBody=$("#planOptsBody");
  if(optsBox) optsBox.addEventListener("toggle", ()=>{
    if(!optsBox.open||optsBody.dataset.loaded) return;
    optsBody.dataset.loaded="1";
    mountPlanOpts(optsBody, dg);
  });
  // #btnPlanOpts 原为模态入口（openPlanEditor 已退役迁入总计划区块）：改为展开
  // 选项折叠组并滚动锚点
  $("#btnPlanOpts").onclick = ()=>{

    const anchor=optsBox||$("#planMaster");

  };

  $("#btnHunterPlan").onclick = doHunterPlan;
  $("#btnStop").onclick = ()=>api("/api/stop", {}).then(r=>{
    if(r.ok===false) toast(r.message||"当前没有在运行","err");
    else toast(r.message||"已请求停止");
    refreshStatus();
  }).catch(alertErr);
  document.querySelectorAll("[data-rid]").forEach(btn=>btn.onclick=async()=>{
    try{ const r=await api("/api/reconcile",{execution_id:btn.dataset.rid,resolution:btn.dataset.res});
      toast(r.message||"已处理"); renderOverview();
    }catch(e){alertErr(e);}
  });
  const sp0=$("#statePill"); sp0.className=statePillClass(run); sp0.textContent=stateShort(run);
  $("#runState").textContent = run.message && run.state!=="waiting" ? run.message : "";
  const blBtn=$("#btnClearBlacklist");
  if (blBtn) blBtn.onclick = async ()=>{
    try{ const r2=await api("/api/today/clear-blacklist", {}); toast(`已清空 ${r2.cleared} 条拉黑，重新规划中`); renderOverview(); }
    catch(e){alertErr(e);}
  };
  drawLog(run.lines||[]);
}

async function doDryRun(){
  const card=$("#dryCard"), body=$("#dryBody");
  card.style.display="block";
  body.innerHTML='<div class="muted">预演中…</div>';
  try{
    const r = await api("/api/dry-run", {});
    if(!r.ok){
      body.innerHTML=`<div class="banner warn">${esc(r.error||"预演失败")}</div>` +
        (r.compat?.problems?.length?`<div class="muted" style="margin-top:6px">${r.compat.problems.map(esc).join("；")}</div>`:"");
      return;
    }
    const steps=r.plan?.steps||[], s0=steps[0];
    let html="";
    if(s0){
      html+=`<div class="banner info">本轮将执行：<b>${esc(s0.name)}</b> × ${s0.runs} 轮（${s0.stamina} 体力，预计 +${s0.gain}）`+
        `；今日额度安排 ${r.plan.detail?`${r.plan.detail.planned_stamina}`:s0.stamina} 体力，剩余 ${r.plan.budget}。</div>`;
      if(r.patch){
        html+=`<div class="muted" style="margin:6px 0">将修改文件：<code>${esc(r.patch.file)}</code>（只列差异）</div>`+
          `<table><tr><th>配置段</th><th>字段</th><th>当前值</th><th>将改为</th></tr>${
            r.patch.diff.map(d=>`<tr><td>${esc(d.section)}</td><td>${esc(d.key)}</td><td class="muted num">${esc(String(d.old??"（新增）"))}</td><td class="num"><b>${esc(String(d.new))}</b></td></tr>`).join("")
          }</table>`;
        if(r.hunter_note) html+=`<div class="muted" style="margin-top:6px">${esc(r.hunter_note)}</div>`;
      }
    }else{
      html=`<div class="empty">当前无需执行：${esc(r.plan?.reason||"")}</div>`;
    }
    if(r.oknte_running) html+=`<div class="banner warn" style="margin-top:8px">ok-nte 当前正在运行：真实执行会等其退出后再写配置</div>`;
    body.innerHTML=html;
  }catch(e){ body.innerHTML=`<div class="banner warn">预演失败：${esc(e.message)}</div>`; }
}

async function mountPlanOpts(host, dg){

  // 具体奖励目标仅「经验与甲硬币」时显示（ask 口径；隐藏时不提交该键）

    const intKeys=["异能材料序号","弧盘材料序号","空幕序号"];
    intKeys.forEach((k,i)=>{
      const v=readNum(`[data-pnum="${i}"]`,k);
      if(v==null) return;
      if(!Number.isInteger(v)) throw new Error(`daily_anomaly『${k}』必须是整数（当前 ${v}）`);
      body.daily_anomaly[k]=v;
    });
    const stam=readNum("[data-pstam]","目标消耗体力");
    if(stam!=null){
      if(!Number.isInteger(stam)||stam<0) throw new Error(`daily_anomaly『目标消耗体力』必须是非负整数（当前 ${stam}）`);
      body.daily_anomaly["目标消耗体力"]=stam;
    }
    // 具名多选：按 cycle_options 全集顺序收集勾选项（value=entry 与 ok-nte 同格式）
    body.daily_anomaly["循环序列"]=[...seqBoxes()].filter(c=>c.checked).map(c=>c.dataset.pseq);
    const hb=host.querySelector("[data-phboss]");
    if(hb.value) body.hunter["追猎目标"]=hb.value;
    const hc=readNum("[data-phcount]","领取奖励次数");
    if(hc!=null){
      if(!Number.isInteger(hc)||hc<0) throw new Error(`hunter『领取奖励次数』必须是非负整数（当前 ${hc}）`);
      body.hunter["领取奖励次数"]=hc;
    }
    host.querySelectorAll("[data-psec]").forEach(el=>{
      const sec=el.dataset.psec, key=el.dataset.pkey;
      let v;
      if(el.type==="checkbox") v=el.checked;
      else if(el.type==="number"){
        const s=String(el.value).trim(); if(s==="") return;
        v=Number(s); if(!Number.isFinite(v)) throw new Error(`misc『${sec}.${key}』不是有效数字`);
      }else if(el.classList.contains("plan-json")){
        try{ v=JSON.parse(el.value); }
        catch(_){ throw new Error(`misc『${sec}.${key}』不是合法 JSON 文本`); }
      }else v=el.value;
      (body.misc[sec]||(body.misc[sec]={}))[key]=v;
    });
    return body;
  };
  // [保存计划]：POST 全量覆盖体 → toast + restarts 提示（口径沿用 _plan_options：
  // ok-nte 运行中=1 无头任务 busy 等待其完全退出后生效，否则 0 独立配置副本每步
  // 拉起重读即生效——BOOT.oknte_running 为页载快照，与侧栏「ok-nte 运行中」标签同源）
  const saved=host.querySelector(".plan-saved");
  host.querySelector("[data-plan-save]").onclick=async ev=>{
    const btn=ev.currentTarget; btn.disabled=true;
    try{
      const r=await api("/api/oknte/plan", collectPlanBody(), 30000);
      const restarts=BOOT.oknte_running?1:0;
      toast("已保存，下次执行生效");
      saved.innerHTML=`<div class="banner ${restarts?"warn":"info"}" style="margin:0">已写入 <code>${esc(r.saved_path||"data/oknte_plan.json")}</code> · 需重启 ok-nte：${restarts} 次${restarts
        ?"（ok-nte 正在运行：无头任务会等待其完全退出后再写配置副本，随后生效）"
        :"（headless 独立配置副本每步拉起重读，下次执行即生效）"}</div>`;
    }catch(e){ toast("操作失败："+e.message,"err"); }
    finally{ btn.disabled=false; }
  };
}
function stateShort(run){
  const map={idle:"空闲",running:"运行中",stopping:"停止中",waiting:"等待中",done:"已完成",stopped:"已停止",error:"出错",interrupted:"已中断"};
  const mode = run.mode==="hunter"?"【追猎】":run.mode==="daily"?"【日常】":"";
  return mode + (map[run.state]||run.state);
}
function waitInfoText(run){
  if(run.state!=="waiting") return "";
  let html = run.waiting_reason?`等待原因：${esc(run.waiting_reason)}`:"";
  if(run.next_retry_at){
    const target=new Date(String(run.next_retry_at).replace(" ","T"));
    if(!isNaN(target)){
      const left=Math.max(0,Math.ceil((target.getTime()-Date.now())/1000));
      html+=`${html?" · ":""}距下次重试 <b class="num">${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</b>（${esc(run.next_retry_at)}）`;
    }
  }
  return html?`<div class="banner warn">${html}</div>`:"";
}
function drawLog(lines){
  const el=$("#log"); if(!el)return;
  el.innerHTML = lines.length? lines.map(l=>{
    const e=esc(l);
    if(/失败|错误|error/i.test(l)) return `<div class="ln err">${e}</div>`;
    if(/等待|重试|警告|warn/i.test(l)) return `<div class="ln warn">${e}</div>`;
    if(/完成|成功|已备份|已开始|已校准/.test(l)) return `<div class="ln ok">${e}</div>`;
    return `<div class="ln">${e}</div>`;
  }).join("") : '<span class="muted">（暂无日志）</span>';
  el.scrollTop=el.scrollHeight;
}
function statePillClass(run){
  if(run.state==="running") return "pill run";
  if(run.state==="waiting"||run.state==="stopping") return "pill wait";
  if(run.state==="error"||run.state==="interrupted") return "pill err";
  return "pill";
}
async function refreshStatus(){
  try{
    const run = await api("/api/status");
    const sp=$("#statePill"); if(sp){sp.className=statePillClass(run);sp.textContent=stateShort(run);}
    const el=$("#runState"); if(el) el.textContent = run.message && run.state!=="waiting" ? run.message : "";
    const w=$("#waitInfo"); if(w) w.innerHTML = waitInfoText(run);
    // 游戏窗口不可见常驻横幅（复审 #7a：runner 的 window_warning 此前无前端消费者，
    // 只能靠「最新日志」瞬时渠道；这里 2s 轮询常驻展示，恢复可见后端清空字段即消失）
    const ww=$("#windowWarn");
    if(ww) ww.innerHTML = run.window_warning ? `<div class="banner warn">⚠ ${esc(run.window_warning)}</div>` : "";
    const b1=$("#btnStart"),bh=$("#btnStartHunter"),b2=$("#btnStop");
    const active = run.state==="running"||run.state==="waiting";
    if(b1) b1.disabled = active;
    if(bh) bh.disabled = active;
    if(b2) b2.disabled = !active;
    drawLog(run.lines||[]);
  }catch(e){}
}
async function startRun(mode){
  try{
    await api("/api/start",{mode});
    toast("已开始执行");
    refreshStatus();
  }catch(e){alertErr(e);}
}
async function startHunterRun(){
  try{
    const boss=$("#hBoss")?.value;
    if(boss) await api("/api/settings",{anomaly_hunter_target:boss});
    await api("/api/start",{mode:"hunter",fixed_runs:+$("#hFixed")?.value||0});
    toast("已开始追猎计划");
    refreshStatus();
  }catch(e){alertErr(e);}
}

        :`<div class="muted">未取到角色面板数据${warn?"："+warn:""}</div>`}
        <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:8px">
          <button class="btn" id="tjdApply">应用 → 写入角色（等级/四技能/觉醒/弧盘/卡带套装·主属性）</button>

        <div class="muted" style="margin-top:6px">应用后直接落库（与 OCR 预填不同，无需再点「保存角色」）；未匹配实名/弧盘的行先在下拉里指定目标（或跳过）再应用。塔吉多通道无此数据（不编造、不改动）：${(d.no_data||[]).map(esc).join("、")}。</div>`;
      box.style.display="";
      box.querySelectorAll("[data-tmap]").forEach(sel=>sel.onchange=()=>{
        const x=TJD_ROWS[+sel.dataset.tmap]; if(!x) return;

        if(st) st.innerHTML=x.target?"<span class='tag ok'>匹配</span>":"<span class='tag warn' title='未匹配实名：先在右侧下拉指定目标角色，或选（跳过）放弃该行'>未匹配</span>";
      });
      box.querySelectorAll("[data-tarcmap]").forEach(sel=>sel.onchange=()=>{

        const rows=TJD_ROWS.filter(x=>x.target).map(x=>({
          target:x.target, level:x.level, awakening:x.awakening, skills:x.skills||{},
          arc_weapon:x.arc_weapon||null, arc_level:(x.arc?.level!=null)?x.arc.level:null,
          cassette:{set:x.cassette?.set||null, main:x.cassette?.main||null}}));
        if(!rows.length){ toast("没有可应用的行（先手动指定目标或跳过）","err"); return; }
        try{
          const r=await api("/api/tajiduo/apply",{rows});
          BOOT.state.characters=r.characters||BOOT.state.characters;
          TJD_ROWS=[]; box.style.display="none";
          // 应用成功即重渲染角色页（与「保存角色」「导入」流程同模式）：输入框与培养
          // 进度立即显示新值，也堵住「接着点保存角色」把旧 DOM 值整行写回的路径
          renderChars();
          // 明细 toast（toast 走 textContent，不再 esc）：含「等级目标→X」「弧盘目标→X」
          // 等 tgt 联动条目，实机可直接确认联动是否生效（诊断 item7）
          const n=(r.applied||[]).reduce((s,a)=>s+a.changed.length,0);
          const detail=(r.applied||[]).map(a=>`${a.target}：${a.changed.join("、")}`).join("；");
          const skip=(r.skipped||[]).map(s=>`${s.target}（${s.reason}）`).join("；");
          toast(`已应用 ${n} 项变更${detail?`：${detail.length>200?detail.slice(0,200)+"…":detail}`:""}${skip?`；跳过：${skip}`:""}`);
        }catch(e){alertErr(e);}
      };
    }
    catch(e){alertErr(e);}
    finally{ btn.disabled=false; btn.textContent="🔄 拉取角色面板（仅预览，不写数据）"; }  // !fr.ok 早退也复位（复审④小疵）：否则按钮卡在「同步中…」直到下次 renderChars
  };
  // 抽卡分析已迁移为独立侧边栏页签（「抽卡」，诊断②改造）：按钮只负责跳页
  $("#tjdGacha").onclick=()=>switchPage("gacha");

/* ---------- 塔吉多抽卡分析（独立页签；绝不自动/定时同步） ---------- */
/* 官方抽卡窗口 180 天（口径同后端 main.py _GACHA_NOTE / tajiduo_client 观测） */
const GACHA_WINDOW_DAYS=180;
function gachaPoolView(d, view){
  /* 选中池的详情视图（2026-11-08 调研模式改版）：汇总卡 + 区间式保底进度条 +
     出S分布直方图 + S 明细横条图。d=payload，view={pool,time}；纯渲染，
     Tab/筛选事件由 renderGacha 绑定（切换只重绘本视图，不重新拉数据）。
     【诚实口径】官方只下发已出 S 记录（含该发 S 的保底计数）与窗口总抽数，
     不下发非 S 逐抽流水 → 当前垫抽数无精确值，能算的只有下界（见下方 pity 推导），
     绝不编造精确垫抽数。 */
  const pools=d.pools||[];
  const p=pools.find(x=>x.key===view.pool)||pools[0];
  if(!p) return `<div class="muted" style="margin-top:10px">暂无数据（绑定后点「同步抽卡记录」拉取）</div>`;
  const nowMs=Date.now();
  const winMs=GACHA_WINDOW_DAYS*86400000, curMs=30*86400000;
  const inWin=ms=>typeof ms==="number"&&ms>0&&ms>=nowMs-winMs;
  const timeOk=r=>{
    if(view.time==="cur") return typeof r.time_ms==="number"&&r.time_ms>=nowMs-curMs;
    if(view.time==="win") return inWin(r.time_ms);
    return true;  // all=全部本地（窗口外记录在直方图分色标注）
  };
  const rows=(p.records||[]).filter(r=>timeOk(r));
  /* 汇总四格改 metric 卡（2026-11-12 AK 排版）：label 12.5px muted + 大数字
     clamp(22,3vw,30) + 12px 小注。官方窗口统计（draw_count 等）仅同步时才下发
     （_tajiduo_gacha_view），未同步如实显示「—」并在小注说明 */
  const gw=v=>(v==null||v==="")?"—":esc(String(v));
  const gmetric=(label,val,note)=>`<div class="gmetric">
    <span class="gmetric-label">${label}</span>
    <b class="gmetric-val">${gw(val)}</b>
    <span class="gmetric-note">${note}</span></div>`;
  const synced=p.draw_count!=null;
  // 百分位大数字（官方 player_over，如 "45%"；未同步/无数据不显示）
  const over=String(p.player_over||"").trim();
  const big=over?`<div style="margin-top:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
    <span style="font-size:30px;font-weight:700;color:var(--acc);line-height:1.1">战胜 ${esc(over)} 玩家</span>
    <span class="muted">官方百分位（该池窗口内）</span></div>`:"";
  // ---- 区间式保底进度条 ----
  // 保底线 m=官方字段（观测：角色池 90 / 弧盘池 60）——数据里只有这一个保底常数，
  // 不虚构「硬保底」数字；下界 X 推导：窗口内未被任何 S 计数器吸收的抽法
  // X = max(0, draw_count − Σ(窗口内各 S 的 pity))（窗口内每抽必属于某个窗口内
  // S 的计数器或 last S 之后的垫抽，故 X 是垫抽下界；首发 S 若跨窗口起点只会让
  // 真值更大，≥X 恒成立）。唯一可数学强制的「精确」：rare_count == draw_count
  // （窗口内每一抽都出 S → 最近一抽必为 S）→ 垫抽=0（截至同步时刻）。
  const mVal=p.m>0?p.m:0;
  const pct=x=>mVal>0?Math.min(100,Math.max(0,x/mVal*100)):0;
  let pity=null, pityWhy="";
  if(p.draw_count!=null&&p.rare_count!=null&&p.draw_count>0&&p.rare_count===p.draw_count){
    pity={x:0,exact:true};
  }else if(p.draw_count!=null){
    const sumWin=(p.records||[]).reduce((s,r)=>s+((inWin(r.time_ms)&&r.pity>0)?r.pity:0),0);
    if(sumWin<=p.draw_count) pity={x:p.draw_count-sumWin,exact:false};
    else pityWhy="官方窗口统计与本地 S 记录暂无法对齐";
  }else pityWhy="尚未同步官方窗口统计（同步后可给出垫抽数下界估算）";
  const y=(mVal>0&&pity)?Math.max(0,mVal-pity.x):null;
  const pityLine=pity
    ?(pity.exact
      ?`<span class="tag ok">精确</span> <span>截至同步时刻垫抽为 0（窗口内每一抽都出 S，最近一抽即 S）${y!=null?`，最晚还剩 ${y} 抽出 S`:""}</span>`
      :`<span class="tag warn">估算</span> <span>已垫 ≥${pity.x} 抽${y!=null?`，最晚还剩 ${y} 抽出 S`:"（官方保底字段缺失，给不出剩余上限）"}</span>`)
    :`<span class="muted">${esc(pityWhy||"垫抽数未知：官方不下发非 S 逐抽流水")}</span>`;
  const bar=(mVal>0&&pity)?`<div class="gpity" title="保底线 m=${mVal}（官方字段，观测：角色池 90 / 弧盘池 60）">
      ${pity.x>0?`<div class="gp-fill" style="width:${pct(pity.x).toFixed(1)}%"></div>`:""}
      <div class="gp-zone" style="left:${pct(pity.x).toFixed(1)}%;right:0"></div>
    </div>`:"";
  // ---- 出S分布直方图：x=保底计数分桶（10 一档），y=次数；窗口外分色（纯 CSS 柱）----
  const allPity=(p.records||[]).map(r=>r.pity).filter(v=>v>0);
  const mAxis=mVal>0?mVal:(allPity.length?Math.max(...allPity):0);
  const buckets=[];
  for(let lo=1;mAxis>0&&lo<=mAxis;lo+=10) buckets.push({lo,hi:Math.min(mAxis,lo+9),win:0,out:0});
  rows.forEach(r=>{
    if(!(r.pity>0)) return;
    const b=buckets.find(b=>r.pity>=b.lo&&r.pity<=b.hi);
    if(b) (inWin(r.time_ms)?b.win++:b.out++);
  });
  const hMax=Math.max(1,...buckets.map(b=>b.win+b.out));
  const hist=buckets.length?`<div class="ghisto">${buckets.map(b=>{
    const tot=b.win+b.out;
    return `<div class="gp-col" title="${b.lo}–${b.hi} 抽出 S：窗口内 ${b.win} 次 / 窗口外 ${b.out} 次">
      <span class="gp-cap">${tot||""}</span>
      <div class="gp-bar" style="height:${tot?Math.max(6,Math.round(tot/hMax*72)):2}px">
        ${b.win?`<div style="flex:${b.win};background:var(--acc);opacity:.85"></div>`:""}
        ${b.out?`<div style="flex:${b.out};background:var(--warn);opacity:.5"></div>`:""}
      </div>
      <span class="gp-cap">${b.lo}–${b.hi}</span>
    </div>`;}).join("")}</div>
    <div class="muted" style="margin-top:4px"><span class="chip acc">官方窗口内</span> <span class="chip warn">窗口外（本地累积保留的更早记录）</span> · 横轴=出 S 那一抽的保底计数${mVal<=0?"（官方保底字段缺失，横轴按记录最大计数）":""}</div>`
    :`<div class="muted" style="margin-top:8px">当前筛选下暂无出 S 记录可分布</div>`;
  // ---- S 明细横躺条形图（2026-11-08 迭代：按月分组 chip 时间线退役）----
  // 每发 S 一行：条上=名称/时间，条长=该发 S 的保底计数占比。分母用所在池
  // 硬保底 p.m（观测：角色池 90 / 弧盘池 60）；官方 m 字段缺失（mVal=0）时退化为
  // 按当前筛选记录最大 pity 归一（与上方直方图横轴同口径），绝不虚构 m。
  // 着色阈值沿用原 chipCls 语义（各池 m 不同 → 用 mVal 动态判定）：
  // ≤30 绿（前段）/ 31→m 之前 橙（软保底区）/ ≥m 红（贴保底线）。
  // rows 已由后端按 time_ms 倒序（_tajiduo_gacha_records_view），最新在最上，直接用。
  const maxPity=rows.reduce((s,r)=>Math.max(s,r.pity>0?r.pity:0),0);
  const barW=r=>{
    if(!(r.pity>0)) return 0;
    if(mVal>0) return Math.min(100,r.pity/mVal*100);
    return maxPity>0?r.pity/maxPity*100:0;
  };
  const gbarCls=r=>!(r.pity>0)?"":(r.pity<=30?"ok":(mVal>0&&r.pity>=mVal)?"err":"warn");
  const bars=rows.length?rows.map(r=>{
    const cls=gbarCls(r), w=barW(r).toFixed(1);
    // 2026-11-10 工作包3：两行结构——上行=角色名/时间/卡池名（角色名此前重复渲染
    // 两次，本轮修复）；下行=100px 头像 + track。第二轮调优：整行悬浮 title 移除，
    // 悬浮信息只剩 track 上的保底计数/时间；卡池名取渲染作用域池对象 p.tab||p.key
    // （后端 payload 无 p.name 字段，与顶部池 Tab 同源）
    return `<div class="gbar-row">
      <div class="gbar-top">
        <b>${r.item_name?esc(r.item_name):`${esc(r.item_id||"—")} <span class='tag warn'>未映射</span>`}</b>
        <span class="num">${esc(r.time||"—")}</span>
        <span>${esc(p.tab||p.key||"—")}</span>
      </div>
      <div class="gbar-body">
        <span class="gbar-av">${r.item_name?avatarImg(r.item_name):""}</span>
        <div class="gbar-track" title="保底计数 ${esc(r.pity??"—")}${mVal>0?` / 软保底 m=${mVal}`:"（官方保底字段缺失）"} · 时间 ${esc(r.time||"—")}">
          <div class="gbar-fill ${cls}" style="width:${w}%"></div>  <!-- 阈值色改 90deg 渐变类（ok/warn/err），见 CSS 2026-11-12 注 -->
          <span class="gbar-val">${esc(r.pity??"—")} 抽</span>
        </div>
      </div>
    </div>`;}).join("")
    :`<div class="muted" style="margin-top:8px">当前筛选下无 S 明细</div>`;
  return `<div style="margin-top:6px">
    <div class="gmetrics">
      ${gmetric("总抽数",p.draw_count,synced?"官方窗口 180 天":"尚未同步官方窗口统计")}
      ${gmetric("已出S",p.rare_count,synced?`本地累积 ${p.s_count??(p.records||[]).length} 条`:"尚未同步官方窗口统计")}
      ${gmetric("平均出S",p.average,synced?"官方窗口内两发 S 间隔均值":"尚未同步官方窗口统计")}
      ${gmetric("软保底 m",mVal>0?p.m:"—",mVal>0?"官方保底字段（观测：角色池 90 / 弧盘池 60）":"官方保底字段缺失")}
    </div>
    ${big}
    <div style="margin-top:10px"><div class="row gp-line" style="gap:8px;flex-wrap:wrap"><b>保底进度</b>${pityLine}</div>${bar}</div>
    <div style="margin-top:10px"><b>出S分布</b>${hist}</div>
    <div style="margin-top:12px"><b>S 明细</b><span style="margin-left:8px;color:var(--faint);font-size:12px">每发 S 一条横条 · 条长=该发保底计数占比${mVal>0?`（软保底 m=${mVal}）`:"（官方保底字段缺失，按当前筛选最大计数归一）"} · 最新在最上</span></div>${bars}
  </div>`;
}

function seriesOptions(prefix, count, cur, onlyN){
  /* ability_N/arc_N/console_N 的可读名来自 materials targets；系列材料优先
     concrete_names.purple（具体道具名，如「黑帽子」——系名"技能书·帽子系（…）"
     不指向具体道具），缺失回退旧逻辑（异能系简写"雏鸟系"，其余前缀照旧）；
     option value 仍是序号键不变；onlyN=数字时只显示该系（角色适配过滤） */
  const targets=(BOOT.tables.materials||{}).targets||[];
  const out=[];
  for(let n=1;n<=count;n++){
    if(onlyN && n!==onlyN) continue;
    const id=`${prefix}_${n}`;
    const t=targets.find(x=>x.id===id);
    const purple=t&&t.concrete_names&&t.concrete_names.purple;
    let label=purple||(t?(t.display_name||t.name):id);
    if(!purple && prefix==="ability"){
      const parts=label.split("·");
      if(parts.length>1) label=parts[1].split("（")[0];
    }
    out.push(`<option value="${n}" ${+cur===n?"selected":""}>${esc(label)}</option>`);
  }
  return out.join("");
}
function abilityOptionsFor(c){
  /* 角色属性 → 书系（attribute_to_skill_series 权威映射 + 个体 skill_series）：
     已确定时只显示适配系；属性缺失时显示全部 5 系 */
  const a2s=(window.__A2S__||{});
  const attr=c.attribute||"";
  const series=c.skill_series||(attr?a2s[attr]:null);
  return seriesOptions("ability", 5, c.mats?.ability, series?+String(series).replace("ability_",""):null);
}
function abilitySeriesOptions(sel){
  /* 技能书系下拉（图鉴录入用）：可读名，绝不显示 ability_N 内部ID；
     优先具体道具紫名（concrete_names.purple，如「黑帽子」），缺失回退系名 */
  const targets=(BOOT.tables.materials||{}).targets||[];

    const t=targets.find(x=>x.id===`ability_${n}`);
    const purple=t&&t.concrete_names&&t.concrete_names.purple;
    const label=purple||(t?(t.display_name||t.name).split("（")[0]:`技能书系${n}`);
    return `<option value="ability_${n}" ${sel===`ability_${n}`?"selected":""}>${esc(label)}</option>`;
  }).join("");
}

  div.querySelectorAll(".c-skill[data-tk='cur']").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const cur=+inp.value||0;
      const tgt=div.querySelector(`.c-skill[data-skill="${inp.dataset.skill}"][data-tk="tgt"]`);
      if(tgt && (+tgt.value||0) < cur) tgt.value=cur;
    });
  });
  // 轨道同规则（角色等级等）：手改 cur 时 tgt 跟抬（与服务端 sanitize 兜底一致）；
  // 弧盘 cur 在角色页无 tgt 输入（目标在「弧盘」页维护），querySelector 找不到即无操作
  div.querySelectorAll("[data-track][data-tk='cur']").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const cur=+inp.value||0;
      const tgt=div.querySelector(`[data-track="${inp.dataset.track}"][data-tk="tgt"]`);
      if(tgt && (+tgt.value||0) < cur) tgt.value=cur;
    });
  });
  const ct2Toggle=div.querySelector(".c-ct2-open");
  if(ct2Toggle) ct2Toggle.onchange=()=>{
    const wrap=div.querySelector(".ct2-wrap");
    if(wrap) wrap.style.display=ct2Toggle.checked?"":"none";
  };
  const handle = div.querySelector(".drag-handle");
  handle.addEventListener("mousedown", ()=>{ div.draggable = true; });
  handle.addEventListener("mouseup", ()=>{ div.draggable = false; });
  div.addEventListener("dragstart", e=>{ e.dataTransfer.setData("text/plain", div.dataset.cid); e.dataTransfer.effectAllowed="move"; });
  div.addEventListener("dragover", e=>{ e.preventDefault(); div.style.borderTop="2px solid var(--acc)"; });
  div.addEventListener("dragleave", ()=>{ div.style.borderTop=""; });
  div.addEventListener("drop", e=>{
    e.preventDefault(); div.style.borderTop="";
    const srcId = e.dataTransfer.getData("text/plain");
    if(!srcId || srcId===div.dataset.cid) return;
    const list = document.getElementById("charList");
    if(!list || !list.contains(div)) return;  // 不想练区的卡片不参与拖动排序
    const src = list.querySelector(`.char[data-cid="${srcId}"]`);
    if(!src || src===div) return;
    list.insertBefore(src, div);
    if(window.reindexChars) window.reindexChars();
    persistCharOrder();
  });
  div.querySelector(".c-enabled").onchange = ()=>{
    const target = div.querySelector(".c-enabled").checked
      ? document.getElementById("charList") : document.getElementById("parkedCards");
    if(target) target.appendChild(div);
    if(window.updateParkedCount) window.updateParkedCount();
  };
  div.querySelector('[data-act="del"]').onclick=()=>{div.remove();};
  div.querySelectorAll('[data-act="maxTrack"]').forEach(btn=>btn.onclick=()=>{
    const tgt=btn.closest(".row").querySelector('[data-tk="tgt"]');
    tgt.value=btn.dataset.max;
  });
  div.querySelector('[data-act="maxAll"]').onclick=()=>{
    div.querySelectorAll(".body .row").forEach(row=>{
      const tgt=row.querySelector('[data-tk="tgt"]');
      const btn=row.querySelector('[data-act="maxTrack"]');
      if(tgt&&btn) tgt.value=btn.dataset.max;
    });
    div.querySelectorAll(".c-skill[data-tk='tgt']").forEach(inp=>inp.value=skillTop);
  };
  div.querySelector('[data-act="up"]').onclick=()=>{if(div.previousElementSibling){div.parentNode.insertBefore(div,div.previousElementSibling);reindex();persistCharOrder();}};
  div.querySelector('[data-act="down"]').onclick=()=>{if(div.nextElementSibling){div.parentNode.insertBefore(div.nextElementSibling,div);reindex();persistCharOrder();}};
  div.querySelector('[data-act="addExtra"]').onclick=()=>{
    div.querySelector(".extra-empty")?.remove();
    div.querySelector(".extra-list").insertAdjacentHTML("beforeend",extraRow("",0,covered));
  };
  return div;
}
function customMatOptions(sel,covered){
  /* 自定义材料下拉：过滤掉模型托管键（BOSS/周本/小怪旧自动总量行） */
  return allMaterials().filter(m=>!covered||!covered.has(m.id))
    .map(m=>`<option value="${m.id}" ${m.id===sel?"selected":""}>${esc(m.display)}</option>`).join("");
}
function extraRow(mat,v,covered){
  return `<div class="row" style="gap:6px"><select>${customMatOptions(mat,covered)}</select>
    <input type="number" value="${v}" min="0" style="width:90px" placeholder="数量">
    <span class="muted">个</span></div>`;
}
function reindex(){document.querySelectorAll(".char").forEach((el,i)=>el.dataset.idx=i);}
window.reindexChars = reindex;
window.updateParkedCount = ()=>{
  const box=document.getElementById("parkedBox"); if(!box) return;
  const n=box.querySelectorAll(".char").length;
  const sum=document.getElementById("parkedSummary"); if(sum) sum.textContent=`不想练（${n}）`;

async function persistCharOrder(){
  /* 拖动/上移下移后立即持久化顺序（专用 reorder 端点只按 id 重排，不重建角色对象，
     任何字段都不会丢；刷新与重启后顺序保留——列表顺序=补齐优先级） */
  const host=document.getElementById("charList"); if(!host) return;
  const ids=[...host.querySelectorAll(".char")].map(el=>el.dataset.cid).filter(Boolean);
  try{ await api("/api/characters/reorder",{ids});
    const byId=new Map((BOOT.state.characters||[]).map(c=>[c.id,c]));
    BOOT.state.characters=ids.map(i=>byId.get(i)).filter(Boolean)
      .concat((BOOT.state.characters||[]).filter(c=>!ids.includes(c.id)));
  }catch(e){alertErr(e);}
}

/* ---------- 弧盘（武器中心：适配过滤 + 搜索 + S/A 排序 + 材料按目标计算） ---------- */
async function renderArc(){
  $("#main").innerHTML='<div class="card"><div class="muted">加载中…</div></div>';
  const tracks = BOOT.tables.requirements.tracks||{};
  const chars = (BOOT.state.characters||[]).filter(c=>c.enabled);  // 不想练（停用）角色不出现在弧盘页
  const gd = await api("/api/game-data").catch(()=>({}));
  const weaponMeta = {};  // 目录武器名 → {matter_state, rarity}（全稀有度收录：适配过滤按物态、排序按稀有度）
  (gd.weapons||[]).forEach(w=>{
    if(w && w.name)
      weaponMeta[w.name] = {matter_state: w.matter_state||"", rarity: w.rarity||""};
  });
  const state_to_can = gd.matter_state_to_can||{};
  const targets = (BOOT.tables.materials||{}).targets||[];
  /* 弧盘 chip 显示名：优先具体道具紫名（concrete_names.purple，如"金色苹果核"），
     缺失回退系名（"弧盘突破·苹果核（铁制→金色）"） */
  const arcDisplayName = n => { const t=targets.find(x=>x.id===`arc_${n}`);
    const purple=t&&t.concrete_names&&t.concrete_names.purple;
    return purple||(t?(t.display_name||t.name):`罐头系${n}（名称缺失）`); };
  const snap = await api("/api/status").catch(()=>null);
  const rowsByChar = {};
  if(snap && snap.snapshot) (snap.snapshot.characters||[]).forEach(c=>{ rowsByChar[c.name] = c.rows||[]; });
  const gapOf = (name, matId) => {
    const row = (rowsByChar[name]||[]).find(x=>x.mat_id===matId);
    return row ? {need:row.need, have:row.have, gap:row.gap, runs:row.runs} : null;
  };
  $("#main").innerHTML=`
    <div class="row save-bar"><button class="btn big" id="saveArc">保存弧盘</button>
      <span class="muted">想要的弧盘不在列表？到「图鉴数据」页登记</span></div>
    <div class="banner info">每行 = 一个角色的<b>弧盘目标</b>：下拉只显示与角色物态<b>适配</b>的弧盘（S→A 排序，可搜索）；罐头系随物态自动派生；材料按填写的等级目标计算。</div>
    <div id="arcList"></div>`;
  const host=$("#arcList");
  if(!chars.length){ host.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>还没有角色，先到「角色」页添加</div>`; return; }
  chars.forEach(c=>host.appendChild(arcCard(c, tracks, weaponMeta, state_to_can, arcDisplayName, gapOf)));
  $("#saveArc").onclick = async ()=>{
    const charsOut = BOOT.state.characters.map(c=>{
      const el = document.querySelector(`.char[data-cid="${c.id}"]`);
      if(!el || !el.querySelector(".a-weapon")) return c;
      const weapon = el.querySelector(".a-weapon").value||"";
      const mats = {...(c.mats||{})};
      const meta = weaponMeta[weapon];
      if(meta){
        const can2 = state_to_can[meta.matter_state];
        if(can2) mats.arc = +String(can2).replace("arc_","")||mats.arc;
      }
      const tracksOut = {...(c.tracks||{})};
      el.querySelectorAll("[data-track]").forEach(inp=>{
        tracksOut[inp.dataset.track]=tracksOut[inp.dataset.track]||{};
        tracksOut[inp.dataset.track][inp.dataset.tk]=+inp.value||0;});
      return {...c, weapon, mats, tracks:tracksOut};
    });
    try{ const r=await api("/api/characters",{characters:charsOut,base_rev:BOOT.rev||0});
      BOOT.state.characters=r.characters||charsOut;
      toast("弧盘已保存");
      renderArc();
    }catch(e){alertErr(e);}
  };
}
function arcWeaponOptions(c, weaponMeta, term){
  /* 只显示与角色物态适配的弧盘（角色物态未知时全显示并提示）；
     武器库实例与目录条目一律按目录元数据（物态/稀有度）过滤与排序——
     此前 from:"lib" 无条件放行，导致"导入全库后下拉=全量"（适配范围失效）；
     S→A→B 排序；term 搜索过滤；已选弧盘即使不在适配列表也保留显示（不丢已选值） */
  const libNames=[...new Set(BOOT.state.weapon_library||[])];
  const all=[...libNames.map(n=>({name:n, from:"lib", ...(weaponMeta[n]||{})})),
             ...Object.keys(weaponMeta).filter(n=>!libNames.includes(n))
                      .map(n=>({name:n, from:"cat", rarity:weaponMeta[n].rarity, ms:weaponMeta[n].matter_state}))];
  const 适配 = c.matter_state||"";
  const rank = r => r==="S"?0:r==="A"?1:2;
  let rows = all.map(x=>({name:x.name, from:x.from, rarity:x.rarity||"", ms:x.ms||x.matter_state||""}));
  if(适配) rows = rows.filter(x=>x.ms===适配);
  if(term) rows = rows.filter(x=>x.name.toLowerCase().includes(term.toLowerCase()));
  rows.sort((a,b)=> (rank(a.rarity)-rank(b.rarity)) || a.name.localeCompare(b.name,"zh"));
  let opts=`<option value="" ${!c.weapon?"selected":""}>（未选择弧盘）</option>`;
  if(term && !rows.length)
    opts+=`<option disabled>（无匹配结果：换个关键词，或到「图鉴数据」页登记该弧盘）</option>`;
  rows.forEach(x=>{
    const tag=x.rarity?`（${x.rarity}）`:"";
    opts+=`<option value="${esc(x.name)}" ${x.name===c.weapon?"selected":""}>${esc(x.name)}${tag}</option>`;});
  if(c.weapon && !rows.some(x=>x.name===c.weapon))
    opts+=`<option value="${esc(c.weapon)}" selected>${esc(c.weapon)}（当前已选·不在适配列）</option>`;
  return opts;
}
function arcCard(c, tracks, weaponMeta, state_to_can, arcDisplayName, gapOf){
  const div=document.createElement("div");
  div.className="char open"; div.dataset.cid=c.id;
  const derive = weapon => {
    const meta = weaponMeta[weapon];
    if(!meta) return null;
    const can2 = state_to_can[meta.matter_state];
    return can2 ? +String(can2).replace("arc_","") : null;
  };
  let can = derive(c.weapon) || c.mats?.arc || 1;
  const arcT = tracks.arc_level||{max:80};
  const arcRow = () => gapOf(c.name, `arc_${can}`);
  const matTxt = row => row?`需 ${row.need} / 持 ${row.have} / 差 ${row.gap} / 约 ${row.runs} 轮`:"无记录";
  const 适配态 = c.matter_state ? "" : "（角色未填物态：显示全部）";
  div.innerHTML=`
    <div class="head" style="flex-wrap:wrap">
      <b class="arc-title">${esc(c.weapon||"（未选弧盘）")}</b>
      <span class="tag acc arc-rarity">${esc((weaponMeta[c.weapon]||{}).rarity||"?")}</span>
      <span class="muted">绑定角色</span><b>${esc(c.name)}</b>
      <span class="grow"></span>
      <input class="a-search" placeholder="🔍 搜索弧盘" style="width:130px">
      <span class="muted">选择弧盘</span>
      <select class="a-weapon" style="max-width:260px">${arcWeaponOptions(c, weaponMeta, "")}</select>
      <button class="btn sec mini" data-act="maxArc">弧盘满级</button>
    </div>
    <div class="body" style="display:block">
      <div class="row" style="gap:6px;margin-bottom:6px">
        <span class="muted">物态→罐头系（自动）</span>
        <span class="chip acc arc-can-chip">${esc(arcDisplayName(can))}</span>
        <span class="muted">弧盘等级</span>
        <input type="number" data-track="arc_level" data-tk="cur" value="${c.tracks?.arc_level?.cur??1}" min="0" style="width:70px"> <span class="muted">→</span>
        <input type="number" data-track="arc_level" data-tk="tgt" value="${c.tracks?.arc_level?.tgt??1}" min="0" max="${arcT.max??80}" style="width:70px">
        <span class="chip num arc-mat-chip">弧盘材料：${matTxt(arcRow())}</span>
      </div>
      ${适配态?`<div class="banner info">${适配态}</div>`:""}
    </div>`;
  const searchEl=div.querySelector(".a-search");
  searchEl.oninput=()=>{
    const sel=div.querySelector(".a-weapon");
    const keep=sel.value;
    sel.innerHTML=arcWeaponOptions(c, weaponMeta, searchEl.value.trim());
    sel.value=keep; if(!sel.value) sel.selectedIndex=0;
  };
  div.querySelector(".a-weapon").onchange = e=>{
    const weapon = e.target.value;
    div.querySelector(".arc-title").textContent = weapon||"（未选弧盘）";
    div.querySelector(".arc-rarity").textContent = (weaponMeta[weapon]||{}).rarity||"?";
    can = derive(weapon) || c.mats?.arc || 1;
    div.querySelector(".arc-can-chip").textContent = arcDisplayName(can);
    div.querySelector(".arc-mat-chip").textContent = `弧盘材料：${matTxt(arcRow())}`;
  };
  div.querySelector('[data-act="maxArc"]').onclick = ()=>{
    div.querySelector('[data-track="arc_level"][data-tk="tgt"]').value = arcT.max??80;
  };
  // 目标≥当前：手改弧盘当前等级时目标跟抬（与角色页/服务端 sanitize 同规则）
  const arcCur=div.querySelector('[data-track="arc_level"][data-tk="cur"]');
  const arcTgt=div.querySelector('[data-track="arc_level"][data-tk="tgt"]');
  if(arcCur&&arcTgt) arcCur.addEventListener("input", ()=>{
    const cur=+arcCur.value||0;
    if((+arcTgt.value||0) < cur) arcTgt.value=cur;
  });
  return div;
}

function statOpts(list, cur){

async function renderNullmux(){
  $("#main").innerHTML='<div class="card"><div class="muted">加载中…</div></div>';
  if(!NULLMUX_CASSETTES){
    const r=await api("/api/wiki/cassettes").catch(()=>null);
    if(r && r.sets){ NULLMUX_CASSETTES=r; }
  }
  const sets=(NULLMUX_CASSETTES||{}).sets||[];

/* ---------- BIS 建议（ntestrategy 快照 builds 段；纯建议展示，不写任何记录） ---------- */
function bisBuildOf(c, buildsArg){
  /* BIS 条目匹配（2026-11-09 工作包3，伊洛伊/跨源异译修复）：此前按 name 精确
     匹配，本地实名与站方译名不一致（法蒂亚 vs 法帝娅、哈尼尔 vs 哈尼娅、
     埃德加 vs 埃德嘉）或角色形态名（零（男））时全部落空。三级匹配：
     ①name 精确 → ②slug 归一（__GUIDE_SLUG_NAMES__：两站同 slug 实体多名并存，
     本地任一译名 → slug → build.id）→ ③去尾部（…）基名（零（男）→零）。
     buildsArg 缺省读 window.__BIS_BUILDS__ 缓存（同步攻略站/拉取BIS后写入）。
     匹配不到返回 null（未覆盖角色，上层明示「暂无建议」）。 */
  const builds=buildsArg||window.__BIS_BUILDS__||[];
  if(!c||!builds.length) return null;
  const name=String(c.name||"").trim();
  if(!name) return null;
  let b=builds.find(x=>x.name===name);
  if(b) return b;
  const slugMap=window.__GUIDE_SLUG_NAMES__||{};
  for(const [slug,names] of Object.entries(slugMap)){
    if((names||[]).includes(name)){
      b=builds.find(x=>x.id===slug);
      if(b) return b;
    }
  }
  const base=name.replace(/（[^）]*）$/,"").trim();
  if(base && base!==name) b=builds.find(x=>x.name===base);
  return b||null;
}
function bisPlainText(b){
  /* 建议文本汇总（一键复制用）：缺失段如实标「（无数据）」 */
  const sec=(title,lines)=>`${title}\n`+(lines.filter(Boolean).join("\n")||"（无数据）");
  const t=b.train||{}, c=b.console||{};
  const tri=v=>(v&&(v.zh||v.en))?(v.zh||v.en):"";
  const out=[`【BIS 建议】${b.name||b.id}（来源：${b.source||"ntestrategy"}）`];
  if(b.arcs&&b.arcs.length)
    out.push(sec("弧盘优先级",b.arcs.map(p=>`[${p.rank||"?"}] ${p.zh||p.en}${p.en&&p.zh?`（${p.en}）`:""}`)));
  out.push(sec("卡带组合", [tri(c.cartridge)&&`卡带：${tri(c.cartridge)}`,
    tri(c.trait)&&`套装特性：${tri(c.trait)}`,
    tri(c.driveReq)&&`驱动块（必需）：${tri(c.driveReq)}`,
    tri(c.driveOpt)&&`驱动块（可选）：${tri(c.driveOpt)}`,
    tri(c.mainstats)&&`主词条优先级：${tri(c.mainstats)}`,
    tri(c.substats)&&`副词条优先级：${tri(c.substats)}`]));
  out.push(sec("养成优先级", [tri(t.stats)&&`属性：${tri(t.stats)}`,
    tri(t.skill)&&`技能：${tri(t.skill)}`, tri(t.awk)&&`觉醒：${tri(t.awk)}`,
    tri(t.arc)&&`弧盘：${tri(t.arc)}`, tri(t.mod)&&`卡带：${tri(t.mod)}`]));
  return out.join("\n\n");
}

function teamAvCell(name){

     首字母占位），空位灰虚线占位 .av-empty。data-avi 下标与 .t-member 一一对应。 */

function bindTeamRows(teams,charNames){

}

/* 背包 OCR v3：窗口绑定与网格标定。依赖后端 /api/ocr/windows、/api/ocr/select、
   /api/ocr/layout、/api/ocr/capture——后两个是真轻量（读/写布局文件，走通用 15s），
   前两个含 PowerShell 窗口枚举（后端 timeout=30s）、capture 含 PS 截屏（最坏 ≈120s），
   走 api() 的加长超时（45s / 150s），别让客户端比后端先放弃。 */
let OCR_CURRENT=null;  // 最近获知的绑定窗口 {process,title}（来自窗口列表或手动选择）
let OCR_LAYOUT=null;   // 已存网格布局缓存（标定沿用 / 背包识别等待上限估算用）
let OCR_RUN=null;      // 进行中的背包 OCR 等待 {ctl,timedOut}；识别中再点一次按钮=取消等待
/* 尽力叫停后端遍历（发后即忘）：POST /api/ocr/cancel 置 _OCR_CANCEL，页间生效——
   当前页的 PS 点击序列点完即停、不再翻页/下一个目标；请求失败（旧后端 404 等）
   静默忽略，不影响主流程。等待超时/用户取消/「放弃」都会调用 */
function ocrFireCancel(){
  try{ fetch("/api/ocr/cancel",{method:"POST",headers:{...AUTH_HEADERS,"Content-Type":"application/json"},
    body:"{}",signal:AbortSignal.timeout(3000)}).catch(()=>{}); }catch(_e){}
}
function ocrLayoutSummary(l){
  if(!l||!l.first_cell) return "";
  const pc=v=>((typeof v==="number"?v:0)*100).toFixed(1)+"%";
  return `首格(${pc(l.first_cell.x)}, ${pc(l.first_cell.y)}) · 步长(${pc(l.step&&l.step.dx)}, ${pc(l.step&&l.step.dy)}) · ${l.cols??"?"}列×${l.rows??"?"}行`;
}
function updateOcrBindInfo(){
  const el=document.getElementById("ocrBindInfo"); if(!el) return;
  const st=(BOOT&&BOOT.state&&BOOT.state.settings)||{};
  el.textContent = OCR_CURRENT
    ? `当前绑定：${OCR_CURRENT.process}${OCR_CURRENT.title?`（${OCR_CURRENT.title}）`:""}`
    : (st.game_process_name ? `当前绑定：${st.game_process_name}（已手动选择）` : "当前绑定：自动查找 HTGame.exe");
}
async function ocrPickWindow(){
  // 窗口枚举后端走 PowerShell（timeout=30s，慢机器接近上限），15s 默认会白报错：传 45s
  const r=await api("/api/ocr/windows", undefined, 45000);
  OCR_CURRENT=r.current||null; updateOcrBindInfo();
  const wins=r.windows||[];
  // 后端 process 为 Get-Process 的 ProcessName（无 .exe 后缀）；剥掉 .exe 再比对，两种口径都命中
  const isGame=w=>String(w.process||"").toLowerCase().replace(/\.exe$/,"")==="htgame";
  const hasGame=wins.some(isGame);
  const isCur=w=>!!OCR_CURRENT&&w.process===OCR_CURRENT.process&&(w.title||"")===(OCR_CURRENT.title||"");
  const ov=document.createElement("div"); ov.className="modal-ov";
  ov.innerHTML=`<div class="modal" style="max-width:620px">
    <h3 style="margin:0 0 10px;font-size:14px">选择识别窗口<span class="h-sub">点选某行即绑定；绑定后背包/角色 OCR 的截屏与点击都用它</span></h3>
    ${hasGame?"":'<div class="banner warn" style="margin:0 0 10px">未发现游戏窗口——请先启动游戏</div>'}
    <div style="max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:10px">
    ${wins.length?`<table><tr><th>进程</th><th>窗口标题</th><th>PID</th></tr>
      ${wins.map(w=>`<tr data-pid="${w.pid}" style="cursor:pointer${isCur(w)?";background:var(--acc-soft)":""}">
        <td style="white-space:nowrap"><b>${esc(w.process)}</b>${isGame(w)?' <span class="tag acc">游戏</span>':""}${isCur(w)?' <span class="tag ok">当前</span>':""}</td>
        <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(w.title||"")}">${esc(w.title||"（无标题）")}</td>
        <td class="num">${w.pid}</td></tr>`).join("")}</table>`
      :'<div class="muted" style="padding:14px">未枚举到可见顶层窗口</div>'}</div>
    <div class="row" style="margin-top:12px"><span class="muted grow" id="ocrWinMsg"></span>
      <button class="btn sec" id="ocrWinClose">关闭</button></div></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.onclick=e=>{ if(e.target===ov) close(); };
  ov.querySelector("#ocrWinClose").onclick=close;
  ov.querySelectorAll("tr[data-pid]").forEach(tr=>tr.onclick=async()=>{
    const pid=+tr.dataset.pid;
    const w=wins.find(x=>x.pid===pid); if(!w) return;
    if(!isGame(w)&&!(await qConfirm(`「${w.process}」不是游戏进程（HTGame.exe），确定绑定为识别窗口吗？`)))return;
    const msg=ov.querySelector("#ocrWinMsg"); msg.textContent="绑定中…";
    try{
      const sr=await api("/api/ocr/select",{pid},45000);  // 绑定含一次窗口枚举（后端 30s 上限）
      OCR_CURRENT={process:(sr.selected&&sr.selected.process)||w.process,
        title:(sr.selected&&sr.selected.title)??w.title};
      // 后端已把进程名/标题写入设置并落盘 state.json，这里同步本地缓存让界面即时一致
      const st=BOOT.state.settings||(BOOT.state.settings={});
      st.game_process_name=OCR_CURRENT.process; st.game_window_keywords=OCR_CURRENT.title||"";
      updateOcrBindInfo();
      toast(`已绑定窗口：${OCR_CURRENT.process}${OCR_CURRENT.title?`（${OCR_CURRENT.title}）`:""}`);
      close();
    }catch(e){ msg.textContent=""; alertErr(e); }
  });
}
async function ocrCalibrate(){
  // 三点标定（2026-11-04 实测修正）：①格(0,0)中心 → ②同行相邻格(1,0)中心 →
  // ③第一格正下方格(0,1)中心 —— dx 与 dy 分别推导（旧版两点共推导致 dy≈0、
  // 遍历"只在同一行来回"）；cols/rows 本弹窗内直接编辑
  // capture 传 150s：后端最坏 ≈120s（窗口枚举 PS 30s + 截图 PS 90s），15s 默认值
  // 会让慢机器首次标定必超时（评审项：后端截图实际成功，前端却报错诱导反复重试）
  const [lr,cr]=await Promise.all([api("/api/ocr/layout"), api("/api/ocr/capture", undefined, 150000)]);
  const layout=lr.layout||{}; OCR_LAYOUT=layout;
  if(!cr.image) throw new Error("后端未返回截图数据");
  // fallback 透传消费（评审项）：截图瞬间窗口失效 → PS 回退整屏截取，
  // 按窗口比例在此图上标定会系统性错位（后端 warnings 明言不可用于标定）——
  // 拒绝打开标定弹窗，原因经 .catch(alertErr) 弹 toast，让用户重试截图
  if(cr.fallback){
    throw new Error((cr.warnings&&cr.warnings[0])||
      "绑定窗口截图时已失效，本次为全屏截取——该图不可用于网格标定，请重试截图");
  }
  const ov=document.createElement("div"); ov.className="modal-ov";
  ov.innerHTML=`<div class="modal" style="max-width:880px">
    <h3 style="margin:0 0 6px;font-size:14px">背包网格标定（三点）<span class="h-sub">依次点击 ①第一格(0,0)中心 → ②同行相邻格(1,0)中心 → ③第一格正下方格(0,1)中心（百分比记录，与分辨率无关）</span></h3>
    <div class="muted" style="margin-bottom:8px">当前布局：${esc(ocrLayoutSummary(layout)||"未保存")}</div>
    <div class="muted" style="margin-bottom:8px">自动翻页步距（scroll.notches，存于 data/ocr_layout.json 可热调）：翻页后<b>少了半行/漏行</b> → notches +1；<b>多了/跳行</b> → notches -1（默认 6，由游戏灵敏度决定、与网格行高不成整数倍，需按实测微调）</div>
    <div id="calWrap" style="position:relative;display:inline-block;max-width:100%;line-height:0;overflow:hidden">
      <img id="calImg" alt="游戏窗口截图" src="data:image/png;base64,${cr.image}"
        style="max-width:100%;max-height:62vh;display:block;cursor:crosshair;border:1px solid var(--line2)">
      <div id="calTip" style="position:absolute;left:0;top:0;background:rgba(4,8,12,.78);padding:2px 9px;border-radius:6px;font-size:12px;color:var(--warn)">请点击「第一格 (0,0)」中心</div>
    </div>
    <div class="row" style="margin-top:10px;gap:10px">
      <span class="muted">列数</span><input type="number" id="calCols" min="1" max="20" value="${layout.cols??7}" style="width:64px">
      <span class="muted">行数</span><input type="number" id="calRows" min="1" max="20" value="${layout.rows??4}" style="width:64px">
      <span class="muted grow" id="calResult"></span>
      <button class="btn sec" id="calReset">重新点击</button>
      <button class="btn" id="calSave" style="display:none">保存布局</button>
      <button class="btn sec" id="calClose">关闭</button></div></div>`;
  document.body.appendChild(ov);
  const img=ov.querySelector("#calImg"), tip=ov.querySelector("#calTip"), wrap=ov.querySelector("#calWrap"),
        result=ov.querySelector("#calResult"), saveBtn=ov.querySelector("#calSave"),
        colsInp=ov.querySelector("#calCols"), rowsInp=ov.querySelector("#calRows");
  let pts=[], pending=null;  // pts：三次点击的百分比坐标
  const draw=()=>{ wrap.querySelectorAll(".cal-dot,.cal-cell").forEach(d=>d.remove());
    pts.forEach((p,i)=>{ const d=document.createElement("div");
      d.className="cal-dot";
      d.style.cssText=`position:absolute;left:${p.x}%;top:${p.y}%;width:13px;height:13px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--warn);border:2px solid #fff;pointer-events:none;font:700 9px/10px sans-serif;color:#04121f;text-align:center`;
      d.textContent=String(i+1); wrap.appendChild(d); }); };
  const gridParams=()=>{
    const cols=Math.min(20,Math.max(1,+colsInp.value||7));
    const rows=Math.min(20,Math.max(1,+rowsInp.value||4));
    let dx=0, dy=0;
    if(pts.length>=2) dx=+(pts[1].x-pts[0].x).toFixed(3);
    if(pts.length>=3) dy=+(pts[2].y-pts[0].y).toFixed(3);
    return {cols, rows, dx, dy};
  };
  const preview=()=>{
    if(pts.length<3) return;
    const {cols,rows,dx,dy}=gridParams();
    // 校验：行距/列距过小（三点几乎共线）→ 阻止保存（dy≈0 即"只在同一行来回"的根因）
    if(rows>1&&Math.abs(dy)<0.5){ tip.textContent="③ 与 ① 的垂直距离过小——第三格必须点在「第一格正下方」的另一行格子上"; tip.style.color="var(--err)"; saveBtn.style.display="none"; return; }
    if(cols>1&&Math.abs(dx)<0.5){ tip.textContent="② 与 ① 的水平距离过小——第二格必须点在同行相邻格子上"; tip.style.color="var(--err)"; saveBtn.style.display="none"; return; }
    tip.textContent="三点完成 — 核对网格预览后点「保存布局」"; tip.style.color="var(--ok)";
    // 契约口径：layout 比例字段为 0-1；UI 展示用百分比，落库前除以 100
    pending={...layout, cols, rows,
             first_cell:{x:+(pts[0].x/100).toFixed(4), y:+(pts[0].y/100).toFixed(4)},
             step:{dx:+(dx/100).toFixed(4), dy:+(dy/100).toFixed(4)}};
    let oob=0;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const x=+(pts[0].x+c*dx).toFixed(2), y=+(pts[0].y+r*dy).toFixed(2);
      if(x<0||x>100||y<0||y>100){ oob++; continue; }
      const d=document.createElement("div");
      d.className="cal-cell";
      d.style.cssText=`position:absolute;left:${x}%;top:${y}%;width:9px;height:9px;margin:-5px 0 0 -5px;border-radius:3px;border:2px solid rgba(83,182,255,.85);background:rgba(83,182,255,.15);pointer-events:none`;
      wrap.appendChild(d);
    }
    result.textContent=`将保存：首格(${pts[0].x}%, ${pts[0].y}%) · 步长(${dx}%, ${dy}%) · ${cols}列×${rows}行`
      +(oob?` —— ⚠ ${oob} 格落点越出截图范围（越界点击会点到其他应用，建议重新标定）`:"");
    result.style.color=oob?"var(--warn)":"";
    saveBtn.style.display="";
  };
  const reset=()=>{ pts=[]; pending=null; draw();
    tip.textContent="请点击「第一格 (0,0)」中心"; tip.style.color="var(--warn)";
    result.textContent=""; result.style.color=""; saveBtn.style.display="none"; };
  ov.querySelector("#calReset").onclick=reset;
  ov.querySelector("#calClose").onclick=()=>ov.remove();
  colsInp.oninput=()=>{ if(pts.length>=3) preview(); };
  rowsInp.oninput=()=>{ if(pts.length>=3) preview(); };
  img.onclick=e=>{
    if(pts.length>=3) return;
    const r=img.getBoundingClientRect();
    pts.push({x:+(((e.clientX-r.left)/r.width)*100).toFixed(3),
              y:+(((e.clientY-r.top)/r.height)*100).toFixed(3)});
    draw();
    tip.textContent=["已记录第一格 (0,0) — 请点击「同行相邻格 (1,0)」中心",
                     "已记录 (1,0) — 请点击「第一格正下方格 (0,1)」中心",
                     "三点完成"][pts.length-1]||"";
    if(pts.length>=3) preview();
  };
  saveBtn.onclick=async()=>{
    if(!pending) return;
    saveBtn.disabled=true;
    try{
      const sr=await api("/api/ocr/layout",{layout:pending});
      const saved=sr.layout||pending; OCR_LAYOUT=saved;
      toast("网格布局已保存并热生效");

    }catch(e){ alertErr(e); }
    finally{ saveBtn.disabled=false; }
  };

        // 叫停后端逐格点击（评审项）：ocrFireCancel() 发后即忘——/api/ocr/cancel 置
        // _OCR_CANCEL，页间生效（当前页的 PS 点击序列已在子进程里跑完不可中断，
        // 之后不再发起下一页/翻页）；请求失败（旧后端 404 等）静默忽略
        ocrFireCancel();
        if(OCR_RUN&&OCR_RUN.timedOut) toast(`识别超时（等待上限 ${Math.round(toMs/1000)}s）——已请求后端停止：当前页会点完，不再翻页，请留意游戏窗口`,"err");
        else toast("已取消等待——已请求后端停止：当前页的逐格点击会点完，之后的页不再继续","err");
      }
      else alertErr(e);
    }
    finally{ clearTimeout(to); OCR_RUN=null; btn.textContent=old; }
  };
  $("#btnOcrWin").onclick=()=>ocrPickWindow().catch(alertErr);
  $("#btnOcrCal").onclick=()=>ocrCalibrate().catch(alertErr);
  // 后台探测：当前绑定 / 游戏是否在运行 / 已存布局（端点未就绪时静默跳过，不打扰页面）
  updateOcrBindInfo();
  api("/api/ocr/windows", undefined, 45000).then(r=>{  // 后台探测：后端枚举上限 30s，别让 15s 白断
    OCR_CURRENT=r.current||null; updateOcrBindInfo();
    const hint=document.getElementById("ocrGameHint");
    if(hint) hint.style.display=r.game_running===false?"":"none";  // 仅在明确未运行时提示
  }).catch(()=>{});
  api("/api/ocr/layout").then(r=>{
    OCR_LAYOUT=r.layout||null;
    const s=ocrLayoutSummary(r.layout), el=document.getElementById("ocrLayoutInfo");
    if(el&&s) el.textContent="已存布局："+s;
  }).catch(()=>{});
  $("#saveInv").onclick=async()=>{
    const inventory={};
    document.querySelectorAll("[data-inv]").forEach(inp=>{const v=+inp.value||0; if(v>0)inventory[inp.dataset.inv]=v;});
    try{const r=await api("/api/inventory",{inventory});BOOT.state.inventory=r.inventory||inventory;toast("库存已保存");}catch(e){alertErr(e);}
  };
}
